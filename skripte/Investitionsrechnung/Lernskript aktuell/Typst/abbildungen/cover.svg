<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 390"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" font-size="20" fill="#244f70"><text x="35" y="40" font-size="27" fill="#244f70">Ein Stück verkauft. Was bleibt davon?</text><rect x="35" y="85" width="270" height="120" rx="16" fill="#244f70"/><text x="55" y="128" font-size="22" fill="white">Erlös</text><text x="55" y="176" font-size="32" fill="white">70 €</text><text x="310" y="155" font-size="25" fill="#244f70">→</text><rect x="340" y="85" width="270" height="120" rx="16" fill="#bc7434"/><text x="360" y="128" font-size="22" fill="white">Variable Kosten</text><text x="360" y="176" font-size="32" fill="white">−30 €</text><text x="615" y="155" font-size="25" fill="#244f70">→</text><rect x="645" y="85" width="270" height="120" rx="16" fill="#16746d"/><text x="665" y="128" font-size="22" fill="white">Deckungsbeitrag</text><text x="665" y="176" font-size="32" fill="white">40 €</text><path d="M780 215 Q780 280 475 280" fill="none" stroke="#16746d" stroke-width="4"/><text x="55" y="310" font-size="26" fill="#16746d">Erst Fixkosten decken. Dann entsteht Gewinn.</text><text x="55" y="355" font-size="21" fill="#244f70">500 Packungen × 40 € = 20 000 € Fixkosten</text></g></svg>