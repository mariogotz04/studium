<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#16746d" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,sans-serif" font-size="21" fill="#24323d"><rect x="0" y="0" width="1000" height="390" fill="#eef4f8" rx="15"/><text x="35" y="38" font-weight="bold" fill="#244f70">Jede Kostenart bindet Geld ab ihrer tatsächlichen Auszahlung</text><path d="M55 100H940" stroke="#16746d" stroke-width="3" marker-end="url(#a)"/><text x="55" y="75">Produktionsbeginn</text><text x="425" y="75">Produktionsende</text><text x="705" y="75">Kundenzahlung</text><path d="M65 100V345M900 100V345" stroke="#95bcb5" stroke-dasharray="5 5"/><rect x="65" y="132" width="835" height="40" fill="#d5ebe3"/><text x="85" y="159">Herstellgemeinkosten: Auszahlung sofort → lange Bindung</text><rect x="255" y="190" width="645" height="40" fill="#c5dce9"/><text x="275" y="217">Löhne: spätere Auszahlung → kürzere Bindung</text><rect x="495" y="248" width="405" height="40" fill="#d5ebe3"/><text x="510" y="275">Material: Lieferantenziel abziehen</text><text x="65" y="335" font-size="19">Fertigung + Fertiglager + Debitorenfrist → Kundenzahlungstag</text><text x="65" y="371" font-size="18">Schematisch; Balken beginnen am jeweiligen Auszahlungstag.</text></g></svg>