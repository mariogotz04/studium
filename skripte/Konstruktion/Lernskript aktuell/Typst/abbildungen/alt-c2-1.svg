<line x1="228" y1="30" x2="228" y2="58" stroke="#c00" marker-start="url(#c2a)" marker-end="url(#c2a)"/><text x="231" y="48" fill="#c00">T</text>
<text x="24" y="120">Welle</text><text x="24" y="132">(Innenteil)</text>
<text x="100" y="95" font-size="9">Go = N + es</text><text x="100" y="108" font-size="9">Gu = N + ei</text>
<text x="100" y="121" font-size="9">T = Go − Gu = es − ei</text>
