  <text x="170" y="262" font-size="30" fill="#16746d" font-weight="bold">−</text>
  <text x="60" y="198" font-size="26" fill="#244f70" font-style="italic">Uq</text>
  <!-- Innenwiderstand -->
  <rect x="300" y="72" width="90" height="36" fill="#ffffff" stroke="#24323d" stroke-width="5"/>
  <text x="325" y="58" font-size="24" fill="#244f70" font-style="italic">Ri</text>
  <!-- Lampe -->
  <circle cx="710" cy="190" r="42" fill="#fff6e5" stroke="#24323d" stroke-width="5"/>
  <line x1="680" y1="160" x2="740" y2="220" stroke="#24323d" stroke-width="4"/>
  <line x1="740" y1="160" x2="680" y2="220" stroke="#24323d" stroke-width="4"/>
  <g stroke="#e0a800" stroke-width="4" stroke-linecap="round">
    <line x1="770" y1="190" x2="805" y2="190"/><line x1="760" y1="145" x2="790" y2="120"/><line x1="760" y1="235" x2="790" y2="260"/>
  </g>
  <text x="772" y="330" font-size="24" fill="#244f70" font-style="italic">Ra</text>
