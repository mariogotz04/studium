  </defs>
  <rect x="0" y="0" width="900" height="380" rx="18" fill="#eef4f8"/>
  <!-- Leiterbahnen -->
  <path d="M190 90 H710 V290 H190 Z" fill="none" stroke="#24323d" stroke-width="5" stroke-linejoin="round"/>
