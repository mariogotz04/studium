  <!-- Klemmenspannung -->
  <line x1="610" y1="120" x2="610" y2="255" stroke="#244f70" stroke-width="4" marker-end="url(#pb)"/>
  <text x="565" y="200" font-size="24" fill="#244f70" font-style="italic">Ua</text>
  <!-- Leitsätze -->
  <text x="300" y="165" font-size="21" fill="#24323d">Spannung treibt,</text>
  <text x="300" y="195" font-size="21" fill="#24323d">Strom fließt,</text>
  <text x="300" y="225" font-size="21" fill="#24323d">Widerstand bremst,</text>
  <text x="300" y="255" font-size="21" fill="#24323d">Leistung kommt an.</text>
