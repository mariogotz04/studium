  <line x1="470" y1="60" x2="580" y2="60" stroke="#c0392b" stroke-width="5" marker-end="url(#pf)"/>
  <text x="515" y="48" font-size="26" fill="#c0392b" font-style="italic">I</text>
  <!-- Elektronen im Leiter -->
  <g fill="#16746d">
    <circle cx="450" cy="290" r="9"/><circle cx="500" cy="290" r="9"/><circle cx="550" cy="290" r="9"/><circle cx="600" cy="290" r="9"/>
  </g>
