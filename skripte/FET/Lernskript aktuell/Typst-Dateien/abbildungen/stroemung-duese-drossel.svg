<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#24323d"><rect x="35" y="85" width="415" height="180" rx="9" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="242.5" y="173.0" text-anchor="middle" font-size="24" fill="#244f70">Düse</text><text x="242.5" y="203.0" text-anchor="middle" font-size="20" fill="#24323d">Enthalpie → Geschwindigkeit</text><rect x="550" y="85" width="415" height="180" rx="9" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="757.5" y="173.0" text-anchor="middle" font-size="24" fill="#244f70">Drossel</text><text x="757.5" y="203.0" text-anchor="middle" font-size="20" fill="#24323d">Druck fällt, h bleibt etwa gleich</text><text x="242" y="190" text-anchor="middle" font-size="24" fill="#16746d">h + c²/2 = konstant</text><text x="758" y="190" text-anchor="middle" font-size="23" fill="#16746d">c₁ ≈ c₂, z₁ ≈ z₂</text><text x="500" y="330" text-anchor="middle" font-size="23" fill="#24323d">Beide Modelle: adiabat, keine äußere technische Arbeit.</text><text x="500" y="370" text-anchor="middle" font-size="23" fill="#b85c44">Eine Drossel ist trotz gleicher Enthalpie irreversibel.</text></g></svg>