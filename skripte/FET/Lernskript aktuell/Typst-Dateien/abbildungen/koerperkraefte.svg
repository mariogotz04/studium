<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410"><rect width="900" height="410" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0L9,3.5L0,7" fill="#167d8d"/></marker></defs><g font-family="serif" font-size="23"><path d="M165 70V160" stroke="#167d8d" stroke-width="4" marker-end="url(#arrow)"/><circle cx="165" cy="225" r="55" fill="#e8f2f6" stroke="#164e63" stroke-width="2"/><path d="M165 290V360" stroke="#bf5b47" stroke-width="4"/><text x="230" y="90">Widerstand + Auftrieb nach oben</text><text x="230" y="348">Gewicht nach unten</text><text x="430" y="170">Stationärer Fall:</text><text x="430" y="215">(m − ρFluid V) g = ½ ρFluid cW A c²</text><text x="430" y="280" font-size="20">cW hängt von Körperform, Re und Rauheit ab.</text><text x="45" y="395" font-size="19">Eigene schematische Darstellung, nicht maßstäblich.</text></g></svg>