<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#24323d"><rect x="10" y="115" width="265" height="105" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="142.5" y="167.5" text-anchor="middle" font-size="24" fill="#244f70">Volumenarbeit</text><text x="142.5" y="197.5" text-anchor="middle" font-size="19" fill="#24323d">Wᵥ = −∫ p dV</text><text x="310" y="177" text-anchor="middle" font-size="32" fill="#16746d">+</text><rect x="350" y="115" width="290" height="105" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="495.0" y="167.5" text-anchor="middle" font-size="24" fill="#244f70">Verschiebung</text><text x="495.0" y="197.5" text-anchor="middle" font-size="19" fill="#24323d">−p₁V₁ + p₂V₂</text><text x="680" y="177" text-anchor="middle" font-size="32" fill="#16746d">=</text><rect x="725" y="115" width="265" height="105" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="857.5" y="167.5" text-anchor="middle" font-size="24" fill="#244f70">Druckarbeit</text><text x="857.5" y="197.5" text-anchor="middle" font-size="19" fill="#24323d">Wₚ = ∫ V dp</text><text x="500" y="55" text-anchor="middle" font-size="24" fill="#244f70">Ein und derselbe Zustandsweg · Zufuhrkonvention</text><text x="500" y="285" text-anchor="middle" font-size="23" fill="#24323d">d(pV) = p dV + V dp verbindet beide Integrale.</text></g></svg>