<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#24323d"><rect x="15" y="105" width="260" height="110" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="145.0" y="160.0" text-anchor="middle" font-size="24" fill="#244f70">Gefälle</text><text x="145.0" y="190.0" text-anchor="middle" font-size="19" fill="#24323d">ρ V̇ g H = 7,848 MW</text><path d="M275 160 L370 160" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="370" cy="160" r="5" fill="#16746d"/><rect x="370" y="105" width="255" height="110" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="497.5" y="160.0" text-anchor="middle" font-size="24" fill="#244f70">Turbine</text><text x="497.5" y="190.0" text-anchor="middle" font-size="19" fill="#24323d">adiabate Bilanz</text><path d="M625 135 L725 80" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="725" cy="80" r="5" fill="#16746d"/><path d="M625 190 L725 260" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="725" cy="260" r="5" fill="#16746d"/><rect x="725" y="25" width="260" height="100" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="855.0" y="75.0" text-anchor="middle" font-size="24" fill="#244f70">Wellenleistung</text><text x="855.0" y="105.0" text-anchor="middle" font-size="19" fill="#24323d">7,000 MW abgegeben</text><rect x="725" y="215" width="260" height="100" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="855.0" y="265.0" text-anchor="middle" font-size="24" fill="#244f70">Innere Energie</text><text x="855.0" y="295.0" text-anchor="middle" font-size="19" fill="#24323d">0,848 MW im Wasser</text><text x="480" y="320" text-anchor="middle" font-size="20" fill="#24323d">„Verlust“ an Nutzarbeit ist hier kein Wärmestrom nach außen.</text></g></svg>