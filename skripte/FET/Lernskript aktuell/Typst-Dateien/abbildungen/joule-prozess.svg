<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#24323d"><rect x="15" y="110" width="260" height="120" rx="9" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="145.0" y="168.0" text-anchor="middle" font-size="24" fill="#244f70">Gewicht sinkt</text><text x="145.0" y="198.0" text-anchor="middle" font-size="20" fill="#24323d">Lageenergie nimmt ab</text><path d="M275 170 L370 170" fill="none" stroke="#16746d" stroke-width="3"/><circle cx="370" cy="170" r="5" fill="#16746d"/><rect x="370" y="110" width="260" height="120" rx="9" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="500.0" y="168.0" text-anchor="middle" font-size="24" fill="#244f70">Rührer dreht</text><text x="500.0" y="198.0" text-anchor="middle" font-size="20" fill="#24323d">Arbeit ins Fluid</text><path d="M630 170 L725 170" fill="none" stroke="#16746d" stroke-width="3"/><circle cx="725" cy="170" r="5" fill="#16746d"/><rect x="725" y="110" width="260" height="120" rx="9" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="855.0" y="168.0" text-anchor="middle" font-size="24" fill="#244f70">Fluid wird wärmer</text><text x="855.0" y="198.0" text-anchor="middle" font-size="20" fill="#24323d">innere Energie steigt</text><text x="500" y="300" text-anchor="middle" font-size="24" fill="#b85c44">Bloßes Abkühlen hebt das Gewicht nicht wieder hoch.</text><text x="500" y="345" text-anchor="middle" font-size="23" fill="#244f70">Rückkehr von System und Umgebung gemeinsam prüfen.</text></g></svg>