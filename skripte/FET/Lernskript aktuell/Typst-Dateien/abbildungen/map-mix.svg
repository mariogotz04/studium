<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 290" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><path d="M475 145 Q180 145 180 65" fill="none" stroke="#95bcb5" stroke-width="3"/><rect x="13" y="17" width="334" height="96" rx="10" fill="#eef4f8"/><text x="180" y="53" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">Masse addiert sich:</text><text x="180" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">m_g = Σ m_i</text><path d="M475 145 Q770 145 770 65" fill="none" stroke="#95bcb5" stroke-width="3"/><rect x="603" y="17" width="334" height="96" rx="10" fill="#eef4f8"/><text x="770" y="53" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">Massenanteil ξ_i = m_i/m_g</text><text x="770" y="78" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">Molanteil ψ_i = n_i/n_g</text><path d="M475 145 Q180 145 180 220" fill="none" stroke="#95bcb5" stroke-width="3"/><rect x="13" y="172" width="334" height="96" rx="10" fill="#eef4f8"/><text x="180" y="208" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">Umrechnen über M:</text><text x="180" y="233" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">ξ_i = ψ_i · M_i / M_g</text><path d="M475 145 Q770 145 770 220" fill="none" stroke="#95bcb5" stroke-width="3"/><rect x="603" y="172" width="334" height="96" rx="10" fill="#eef4f8"/><text x="770" y="208" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">Gemischgrößen:</text><text x="770" y="233" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#24323d">R_g = Σ ξ_i R_i,  M_g = Σ ψ_i M_i</text><rect x="363" y="110" width="224" height="70" rx="15" fill="#16746d"/><text x="475" y="152" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="white" font-weight="bold">Gemisch</text></svg>