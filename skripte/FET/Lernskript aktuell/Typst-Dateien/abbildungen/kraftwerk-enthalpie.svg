<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#24323d"><rect x="200" y="100" width="230" height="110" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="315.0" y="155.0" text-anchor="middle" font-size="24" fill="#244f70">Dampfkessel</text><text x="315.0" y="185.0" text-anchor="middle" font-size="19" fill="#24323d">q₁₂ = h₂ − h₁</text><rect x="590" y="100" width="230" height="110" rx="10" fill="#eef4f8" stroke="#16746d" stroke-width="2"/><text x="705.0" y="155.0" text-anchor="middle" font-size="24" fill="#244f70">Turbine</text><text x="705.0" y="185.0" text-anchor="middle" font-size="19" fill="#24323d">wₜ,₂₃ = h₃ − h₂</text><path d="M30 155 L200 155" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="200" cy="155" r="5" fill="#16746d"/><path d="M430 155 L590 155" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="590" cy="155" r="5" fill="#16746d"/><path d="M820 155 L970 155" stroke="#16746d" stroke-width="4" fill="none"/><circle cx="970" cy="155" r="5" fill="#16746d"/><text x="105" y="120" text-anchor="middle" font-size="21" fill="#24323d">① Wasser</text><text x="510" y="120" text-anchor="middle" font-size="21" fill="#24323d">② Dampf</text><text x="900" y="120" text-anchor="middle" font-size="21" fill="#24323d">③ Dampf</text><text x="105" y="240" text-anchor="middle" font-size="21" fill="#24323d">h₁ = 128</text><text x="510" y="240" text-anchor="middle" font-size="21" fill="#24323d">h₂ = 3150</text><text x="900" y="240" text-anchor="middle" font-size="21" fill="#24323d">h₃ = 2350</text><text x="500" y="310" text-anchor="middle" font-size="19" fill="#24323d">Enthalpien in kJ/kg · gleicher Massenstrom · äußere Energien vernachlässigt</text></g></svg>