name: Webseite bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # für das "Stand"-Datum je Skript
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - run: pip install pypdf pdfplumber
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 -m unittest test_zitate.py
      - run: node test_zitate.cjs
      - name: Veröffentlichte Zitatdatenbank erhalten
        run: python3 zitate_aktualisieren.py --merge-public
      - name: Zitatdatenbank aus Internetquellen ergänzen
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 zitate_aktualisieren.py --limit 10
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
