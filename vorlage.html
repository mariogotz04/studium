<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernen">
<title>Mein Studium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231F6F68'/><path d='M9 8h10l4 4v12H9z' fill='white'/><path d='M12 16h8M12 20h6' stroke='%231F6F68' stroke-width='2'/></svg>">
<style>
:root {
  color-scheme: only light;   /* immer hell, auch wenn Browser/System auf Dunkel stehen */
  /* Design A „Ruhig & klar“: Papierton, Serifen-Überschriften, ein ruhiges Petrol als Akzent */
  --bg: #f6f3ec; --card: #ffffff; --ink: #1f2328; --muted: #5e6670; --line: #e4ded2; --line-strong: #cfc7b8;
  --accent: #1f6f68; --accent-ink: #ffffff; --accent-soft: #e3efec; --teal: #1f6f68; --seg: #ece6da;
  --again: #b4372e; --hard: #9a5b0e; --good: #1f6f68; --easy: #2d5da8; --bild: #fbf4e2; --bild-line: #eadcb4; --bild-ink: #8a6516;
  --ok: #2e7d4f; --ok-soft: #e8f3ec; --no: #b4372e; --no-soft: #f8e9e7; --warn: #9a5b0e; --warn-soft: #fbf1e1;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --shadow: 0 10px 30px rgba(60, 50, 30, .06);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding: max(32px, env(safe-area-inset-top)) 24px 64px; }
.kopf { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 20px; flex-wrap: wrap; }
.datum { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
header h1 { margin: 0 0 4px; font-family: var(--serif); font-size: clamp(30px, 4.2vw, 42px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
header p { margin: 0; color: var(--muted); }
h2 { font-family: var(--serif); font-weight: 700; }
.navi { display: flex; gap: 10px; align-items: center; max-width: 100%; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--seg); border-radius: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 18px; min-height: 44px; display: flex; align-items: center; border-radius: 10px; white-space: nowrap;
  font-weight: 600; color: var(--muted); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.tabs a[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.syncknopf { min-height: 52px; min-width: 52px; border-radius: 14px; border: 0; background: var(--seg); color: var(--muted);
  font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 0 14px; cursor: pointer;
  text-decoration: none; white-space: nowrap; }
.syncknopf i { width: 9px; height: 9px; border-radius: 5px; background: var(--line-strong); }
.syncknopf.an i { background: var(--ok); } .syncknopf.fehler i { background: var(--again); } .syncknopf.läuft i { background: var(--hard); }
.search { margin: 26px 0 16px; width: 100%; padding: 14px 16px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#list, .decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 14px; }
.script { display: flex; gap: 16px; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.script { flex-direction: column; align-items: stretch; justify-content: flex-start; }
.hoerangebot { border-top: 1px solid var(--line); padding-top: 14px; }
.hoerangebot h3 { font-family: var(--serif); font-size: 19px; margin: 0 0 4px; }
.hoerangebot p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.hoertext { max-width: 760px; margin: 0 auto; }
.hoertext h2, .hoertext h3 { font-family: var(--serif); line-height: 1.25; }
.hoertext h3 { font-size: 22px; margin: 30px 0 10px; }
.hoertext p { max-width: 68ch; }
.hoertext .denkpause { border-left: 3px solid var(--accent); padding: 0 0 0 18px; margin: 28px 0; }
.denkpause h3 { color: var(--accent); margin-top: 0; }
.denkpause summary { min-height: 48px; padding: 12px 14px; border: 1px solid var(--line-strong);
  border-radius: 12px; cursor: pointer; font-weight: 600; background: var(--card); }
.denkpause details[open] summary { margin-bottom: 12px; }
.denkpause summary:focus-visible, .hoertext a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hoernavigation { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.epubstatus { color: var(--again); font-size: 14px; margin: 8px 0 0; }
.script .title { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.25; }
.script .sub { margin-top: 1px; }
.script .stand { color: var(--teal); font-weight: 600; }
.script .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 18px;
  border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; border: 1px solid var(--line-strong);
  color: var(--ink); background: var(--card); white-space: nowrap; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.gross { min-height: 60px; font-size: 18px; padding: 0 28px; border-radius: 16px; }
.btn.klein { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.link { background: none; border: 0; min-height: 44px; padding: 0 6px; font: inherit; font-size: 15px; color: var(--muted);
  text-decoration: underline; cursor: pointer; }
.empty { color: var(--muted); margin-top: 32px; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
footer.stand { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); text-align: center; padding-bottom: env(safe-area-inset-bottom); }
body.lernen footer.stand { display: none; }
.neustand { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60;
  min-height: 48px; padding: 0 20px; border: 0; border-radius: 24px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.18); cursor: pointer; }
/* PDF-Ansicht für die Home-Bildschirm-App (dort gibt es keinen Zurück-Knopf) */
.pdfansicht { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #e9e5dc; }
.pdfansicht[hidden] { display: none; }
.pdfleiste { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--card); border-bottom: 1px solid var(--line); }
.pdfleiste .titel { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdfseiten { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
.pdfseite { position: relative; max-width: 900px; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.pdfseite canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pdfinfo { text-align: center; color: var(--muted); margin-top: 40px; }
.muted { color: var(--muted); }
p a, .muted a { color: var(--accent); font-weight: 600; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin: 16px 0; }
.panel > h2:first-child, .panel > h3:first-child { margin-top: 0; }
.panel h2 { font-size: 22px; margin: 0 0 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 12px; }
select, input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=search], textarea {
  font: inherit; font-size: 16px; padding: 10px 12px; min-height: 46px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.l { font-size: 14px; color: var(--muted); }
.feynman { font-size: 14px; color: var(--muted); border-left: 3px solid var(--teal); padding: 2px 0 2px 10px; margin: 0; }
.back { display: inline-flex; align-items: center; min-height: 44px; margin: 16px 0 4px; color: var(--accent); text-decoration: none; font-weight: 600; }
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--seg); border-radius: 12px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 9px;
  min-height: 44px; padding: 0 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: var(--seg); border-radius: 6px; padding: 2px 7px; }
.chip.rechnen { color: var(--easy); background: #e7eef9; } .chip.verstehen { color: var(--bild-ink); background: var(--bild); }
.chip.klausur { color: var(--again); background: var(--no-soft); } .chip.abgabe { color: var(--hard); background: var(--warn-soft); }
.chip.termin { color: var(--accent); background: var(--accent-soft); }
.zwei { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0 22px; align-items: start; }
.kasten-titel { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.kasten-titel h2 { margin: 0; font-size: 22px; }
.kasten-titel a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 15px; }

/* Startseite */
.uhr { padding: 22px 24px; }
.uhr .zeit { font-family: var(--serif); font-weight: 700; font-size: clamp(64px, 9vw, 104px); line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; }
.uhr .zeit small { font-size: .38em; color: var(--muted); margin-left: 6px; font-weight: 600; }
.uhr .tag { font-size: 18px; font-weight: 600; margin-top: 6px; }
.uhr .hinweis { color: var(--hard); font-weight: 600; margin-top: 4px; }
.jetzt { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); }
.jetzt b { display: block; color: var(--ink); font-size: 17px; }
.plan { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.plan li { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); border-left: 4px solid var(--easy); background: var(--card); }
.plan li.vorbei { opacity: .5; }
.plan li.läuft { border-color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.plan li.Übung { border-left-color: var(--ok); } .plan li.Sonstiges, .plan li.Praktikum { border-left-color: #8b6bb5; }
.plan li.Prüfung { border-left-color: var(--again); }
.plan .von { font-variant-numeric: tabular-nums; font-weight: 600; }
.plan .von small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.plan .was { font-weight: 600; line-height: 1.35; }
.plan .was small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.vorschlag { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 6px 12px 0;
  border-top: 1px solid var(--line); }
.vorschlag:first-of-type { border-top: 0; }
.haken { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--line-strong); background: var(--card); cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: transparent; font-size: 22px; font-weight: 700; padding: 0;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.haken.an { background: var(--ok); border-color: var(--ok); color: #fff; }
.vorschlag .was b { display: block; line-height: 1.35; }
.vorschlag .was span { font-size: 14px; color: var(--muted); }
.vorschlag.erledigt .was { opacity: .5; } .vorschlag.erledigt .was b { text-decoration: line-through; }
.frist { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.frist:first-of-type { border-top: 0; }
.frist .was b { display: block; line-height: 1.35; }
.frist .was span { font-size: 14px; color: var(--muted); }
.frist .rest { text-align: right; font-variant-numeric: tabular-nums; }
.frist .rest b { display: block; font-family: var(--serif); font-size: 28px; line-height: 1.05; }
.frist .rest span { font-size: 13px; color: var(--muted); }
.frist.bald .rest b { color: var(--again); }
.frist .knöpfe { grid-column: 1 / -1; display: flex; gap: 8px; }
.countdown { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--again); border-radius: 18px; padding: 18px 22px; margin: 16px 0; }
.countdown .uhrwerk { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.countdown .uhrwerk div { text-align: center; min-width: 70px; }
.countdown .uhrwerk b { display: block; font-family: var(--serif); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.countdown .uhrwerk span { font-size: 13px; color: var(--muted); }
.todo { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.todo:first-of-type { border-top: 0; }
.todo .was span { display: block; font-size: 13px; color: var(--muted); }
.todo.fertig .was { opacity: .5; text-decoration: line-through; }
.todo .weg, .frist .weg { background: none; border: 0; color: var(--muted); font-size: 22px; width: 44px; height: 44px; cursor: pointer; border-radius: 22px; }
.neu-zeile { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.neu-zeile input[type=text] { flex: 1 1 220px; }
.formular { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.formular .ganz { grid-column: 1 / -1; }
.formular label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.formular input, .formular select { width: 100%; }

/* Lernen */
.modgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.modkarte { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 20px; color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.modkarte .title { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.25; }
.modkarte .zeilen { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.modkarte .zeilen b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 16px 0 6px; }
.bar i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.modkarte .bar { margin: 2px 0 0; }
.pomokarte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.pomokarte .zahl { font-family: var(--serif); font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kapitelkopf { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
.aliste { display: grid; gap: 8px; }
.azeile { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; min-height: 56px; color: var(--ink); text-decoration: none;
  -webkit-tap-highlight-color: transparent; }
.azeile:active { transform: scale(.995); }
.punkt { width: 14px; height: 14px; border-radius: 7px; border: 2px solid var(--line-strong); }
.punkt.ok { background: var(--ok); border-color: var(--ok); } .punkt.hilfe { background: var(--warn); border-color: var(--warn); }
.punkt.nein { background: var(--no); border-color: var(--no); }
.azeile b { font-weight: 600; line-height: 1.35; }
.filter { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px; }
/* Aufgabe: Bausteine sind von Typst gesetzte SVGs; 11pt entsprechen 1em, so sieht es aus wie im Lernskript */
.akarte { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 28px; box-shadow: var(--shadow); font-size: 19px; }
.akarte h2 { margin: 6px 0 12px; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.25; }
img.baustein { display: block; max-width: 100%; height: auto; }
.schritt { margin-top: 14px; padding: 14px 0 0; border-top: 1px dashed var(--line-strong); animation: auf .35s ease; }
.schritt .lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; }
.extra { margin-top: 14px; border-radius: 14px; padding: 12px 16px; animation: auf .3s ease; }
.extra.tipp { background: var(--bild); } .extra.erg { background: var(--accent-soft); }
.extra .lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bild-ink); margin-bottom: 4px; }
.extra.erg .lab { color: var(--accent); }
@keyframes auf { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.asteuer { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.asteuer .btn.primary { flex: 1 1 260px; }
.bewerten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.bewerten button { font: inherit; font-size: 17px; font-weight: 700; min-height: 68px; border-radius: 16px; cursor: pointer; background: var(--card);
  border: 2px solid currentColor; line-height: 1.25; touch-action: manipulation; }
.bewerten button small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.bewerten .ok { color: var(--ok); } .bewerten .hilfe { color: var(--warn); } .bewerten .nein { color: var(--no); }
.bewerten button.gewählt { color: #fff; } .bewerten .ok.gewählt { background: var(--ok); } .bewerten .hilfe.gewählt { background: var(--warn); }
.bewerten .nein.gewählt { background: var(--no); } .bewerten button.gewählt small { color: inherit; opacity: .85; }
.topbar { display: flex; align-items: center; gap: 14px; }
.topbar .back { margin: 0; padding: 10px 4px; white-space: nowrap; }
/* Probeklausur */
.probekopf { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: var(--bg); padding: 10px 0; margin: 6px 0 12px; border-bottom: 1px solid var(--line); }
.probekopf .back { margin: 0; }
.probeuhr { font-family: var(--serif); font-size: clamp(34px, 5vw, 46px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.probeuhr small { display: block; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.probeuhr.knapp { color: var(--warn); } .probeuhr.über { color: var(--again); }
.akarte + .akarte { margin-top: 16px; }
.plab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.probezeile { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.probezeile:first-of-type { border-top: 0; }
.abschluss textarea { margin: 6px 0 12px; font-size: 17px; }
.topbar .bar { flex: 1; margin: 0; }
.topbar .zahl { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

function zufall(saat) {
  let h = 1779033703 ^ saat.length;
  for (let i = 0; i < saat.length; i++) { h = Math.imul(h ^ saat.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
const wählen = (liste, rnd) => liste.length ? liste[Math.floor(rnd() * liste.length)] : null;

/* ───────────── Daten, die über alle Geräte synchronisiert werden ─────────────
   Jeder Eintrag ist eine Zeile (Schlüssel → Wert, Änderungszeit). Lokal liegt alles im localStorage, damit die Seite
   auch offline funktioniert. Bei einer Anmeldung gleicht sie sich mit Supabase ab: neuere Änderung gewinnt, je Eintrag.
   Schlüssel: karte:<Modul>:<id>, aufgabe:<Modul>:<id>, quiz:<Modul>:<id>, frist:<id>, todo:<id>,
   erledigt:<Tag>, pomo:<Tag>, einst:<Name> */
const db = {
  cache: new Map(),
  laden() {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k.startsWith("db:")) continue;
      try { this.cache.set(k.slice(3), JSON.parse(localStorage.getItem(k))); } catch {}
    }
  },
  get(k, d) { const r = this.cache.get(k); return r && r.v != null ? r.v : d; },
  zeit(k) { return this.cache.get(k)?.t || 0; },
  set(k, v, t = Date.now(), vonServer = false) {
    const r = { v: v ?? null, t };
    this.cache.set(k, r);
    try { localStorage.setItem("db:" + k, JSON.stringify(r)); } catch {}
    if (!vonServer) sync.vormerken(k);
  },
  // alle Einträge mit diesem Anfang als Objekt (Rest des Schlüssels → Wert), gelöschte ausgelassen
  objekt(anfang) {
    const o = {};
    for (const [k, r] of this.cache) if (r.v != null && k.startsWith(anfang)) o[k.slice(anfang.length)] = r.v;
    return o;
  },
};
db.laden();

DECKS.forEach(d => {
  const alt = store.get("karteikarten:" + d.name, null);

  for (const [id, s] of Object.entries(alt)) if (!db.cache.has(`karte:${d.name}:${id}`)) db.set(`karte:${d.name}:${id}`, s, 1);
  localStorage.removeItem("karteikarten:" + d.name);
});
if (store.get("karteikarten:einstellungen", null)) {

  localStorage.removeItem("karteikarten:einstellungen");
}

const auth = {
  get s() { return store.get("auth", null); },
  set s(v) { v ? store.set("auth", v) : localStorage.removeItem("auth"); },
  email() { try { return JSON.parse(atob(this.s.access_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).email; } catch { return ""; } },
  async anfrage(pfad, body, methode = "POST", token = null) {
    const r = await fetch(SUPABASE.url + pfad, { method: methode,
      headers: { apikey: SUPABASE.key, "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
      body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || `Fehler ${r.status}`);
    return j;
  },
  merken(j) {
    this.s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (+j.expires_in || 3600) * 1000 };
  },
  async token() {
    const s = this.s;
    if (!s) return null;
    if (s.expires_at - Date.now() > 60e3) return s.access_token;
    try { this.merken(await this.anfrage("/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh_token })); }
    catch (e) { if (/invalid|not found|revoked|expired/i.test(e.message)) this.s = null; throw e; }
    return this.s.access_token;
  },
  seite: () => location.origin + location.pathname,
  // Normale Anmeldung: E-Mail und Passwort. Auf jedem Gerät einmal, danach bleibt man angemeldet.
  async passwortAnmelden(email, passwort) {
    try { this.merken(await this.anfrage("/auth/v1/token?grant_type=password", { email, password: passwort })); }
    catch (e) { throw new Error(/invalid login|credentials/i.test(e.message) ? "E-Mail oder Passwort stimmt nicht." : e.message); }
  },
  // Passwort festlegen oder ändern (nur angemeldet, z. B. nach der Anmeldung per E-Mail-Link)
  async passwortSetzen(passwort) {
    await this.anfrage("/auth/v1/user", { password: passwort }, "PUT", await this.token());
    store.set("auth:passwort", true);
  },
  async linkSenden(email) {
    try { await this.anfrage("/auth/v1/otp?redirect_to=" + encodeURIComponent(this.seite()), { email, create_user: true }); }
    catch (e) { throw new Error(/rate limit/i.test(e.message) ? "Zu viele E-Mails in kurzer Zeit. Es gehen nur wenige Anmeldelinks pro Stunde raus, versuch es in einer Stunde wieder." : e.message); }
  },
  // Link aus der E-Mail hier einfügen: nötig, wenn die Seite als App auf dem Home-Bildschirm liegt
  // (der Link öffnet sonst Safari, und die Anmeldung landet dort statt in der App).
  async linkEinlösen(text) {
    const url = new URL(text.trim());
    const token = url.searchParams.get("token") || url.searchParams.get("token_hash");
    if (!token) throw new Error("In diesem Link steht kein Anmeldecode.");
    this.merken(await this.anfrage("/auth/v1/verify", { type: url.searchParams.get("type") || "magiclink", token_hash: token }));
  },
  // Rückkehr vom Anmeldelink: Die Sitzung steht im Adress-Anker (#access_token=…)
  ausAdresse() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("access_token")) {
      this.merken({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") });
      history.replaceState(null, "", location.pathname + "#konto");
      return "ok";
    }
    if (h.get("error_description")) {
      history.replaceState(null, "", location.pathname + "#konto");
      return h.get("error_description").replace(/\+/g, " ");
    }
    return null;
  },
};

const sync = {
  offen: new Set(store.get("sync:offen", [])),
  stand: store.get("sync:stand", "1970-01-01T00:00:00Z"),
  zustand: "aus", fehler: "", zuletzt: store.get("sync:zuletzt", 0), timer: null, läuft: false,
  vormerken(k) { this.offen.add(k); store.set("sync:offen", [...this.offen]); clearTimeout(this.timer); this.timer = setTimeout(() => this.jetzt(), 1500); },
  async rest(pfad, opt = {}) {
    const token = await auth.token();
    if (!token) throw new Error("nicht angemeldet");
    const r = await fetch(SUPABASE.url + "/rest/v1/" + pfad, { ...opt,
      headers: { apikey: SUPABASE.key, Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opt.headers || {}) } });
    // Antwort als Text lesen: Das Hochladen antwortet mit leerem Inhalt (Status 200), und r.json() bricht daran
    // in Safari mit „The string did not match the expected pattern.“ ab, obwohl alles gespeichert wurde.
    const text = await r.text();
    let j = null;
    try { j = text ? JSON.parse(text) : null; } catch {}
    if (!r.ok) throw new Error(j?.message || `Fehler ${r.status}`);
    return j;
  },
  async jetzt() {
    if (!auth.s || this.läuft) return;
    this.läuft = true; this.anzeigen("läuft");
    let geändert = false;
    try {
      // 1. Abholen, was andere Geräte seit dem letzten Abgleich geschrieben haben (mit etwas Überlappung)
      let ab = new Date(Date.parse(this.stand) - 10e3).toISOString();
      for (;;) {
        const zeilen = (await this.rest(`zustand?select=schluessel,wert,geaendert,server_zeit&server_zeit=gt.${encodeURIComponent(ab)}&order=server_zeit.asc&limit=1000`)) || [];
        for (const z of zeilen) {
          const t = Date.parse(z.geaendert);
          if (t > db.zeit(z.schluessel)) { db.set(z.schluessel, z.wert, t, true); this.offen.delete(z.schluessel); geändert = true; }
          ab = z.server_zeit;
        }
        if (zeilen.length) this.stand = ab;
        if (zeilen.length < 1000) break;
      }
      // 2. Eigene Änderungen hochladen
      const liste = [...this.offen];
      for (let i = 0; i < liste.length; i += 500) {
        const teil = liste.slice(i, i + 500).map(k => ({ schluessel: k, wert: db.cache.get(k)?.v ?? null,
          geaendert: new Date(db.zeit(k) || Date.now()).toISOString() }));
        await this.rest("zustand?on_conflict=user_id,schluessel", { method: "POST", body: JSON.stringify(teil),
          headers: { Prefer: "resolution=merge-duplicates,return=minimal" } });
        teil.forEach(z => this.offen.delete(z.schluessel));
      }
      store.set("sync:offen", [...this.offen]); store.set("sync:stand", this.stand);
      this.zuletzt = Date.now(); store.set("sync:zuletzt", this.zuletzt);
      this.fehler = ""; this.anzeigen("an");
    } catch (e) {
      this.fehler = e.message; this.anzeigen(auth.s ? "fehler" : "aus");
    }
    this.läuft = false;
    if (geändert) neuZeichnen();
  },
  anzeigen(z) {
    this.zustand = auth.s ? z : "aus";
    const k = $("#syncknopf");
    k.className = "syncknopf " + ({ an: "an", fehler: "fehler", läuft: "läuft" }[this.zustand] || "");
    k.querySelector("span").textContent = { an: "Synchron", fehler: "Offline", läuft: "Abgleich …", aus: "Sync einrichten" }[this.zustand];
    if (location.hash === "#konto") kontoSeite();
  },
};
setInterval(() => document.visibilityState === "visible" && sync.jetzt(), 60e3);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && sync.jetzt());

/* ───────────── Fristen und Termine ───────────── */
// Eigene Einträge (frist:<id>) plus Prüfungen, die im Vorlesungsplan als Prüfung markiert sind.
function fristen(mitErledigten = false) {
  const eigene = Object.entries(db.objekt("frist:")).map(([id, f]) => ({ id, ...f }));
  const ausPlan = PLAN.termine.filter(t => t.art === "Prüfung").map(t => ({ id: "plan-" + t.d + t.von, titel: t.t, datum: t.d, zeit: t.von,
    art: "klausur", modul: t.m || "", notiz: t.raum ? "Raum " + t.raum : "", plan: true }))
    .filter(p => !eigene.some(e => e.datum === p.datum && e.modul && e.modul === p.modul));
  return [...eigene, ...ausPlan].filter(f => mitErledigten || !f.erledigt)
    .map(f => ({ ...f, ts: new Date(`${f.datum}T${f.zeit || "23:59"}:00`).getTime() })).sort((a, b) => a.ts - b.ts);
}
function rest(ts, jetzt = Date.now()) {
  const d = ts - jetzt;
  if (d <= 0) return { zahl: "vorbei", text: "" };
  const tage = Math.floor(d / 864e5), std = Math.floor(d % 864e5 / 36e5), min = Math.floor(d % 36e5 / 6e4);
  if (tage >= 2) return { zahl: tage, text: "Tage" };
  if (tage === 1) return { zahl: `1 T ${std} h`, text: "noch" };
  if (std >= 1) return { zahl: `${std} h ${min} min`, text: "noch" };
  return { zahl: `${min} min`, text: "noch" };
}
const ARTEN = { klausur: "Klausur", abgabe: "Abgabe", termin: "Termin" };
// Klausurtyp und -dauer je Modul (einst:klausur). Transfer: Verstehen und Rechnen, Abfrage: Wissen abrufen.
const KLAUSURTYPEN = { transfer: "Transfer", gemischt: "Gemischt", abfrage: "Abfrage" };
const KLAUSUR_STANDARD = { Finanzierung: "gemischt", Investitionsrechnung: "gemischt" };   // alle anderen Module: Transfer
function klausurInfo(m) {
  const e = db.get("einst:klausur", {})[m] || {};
  return { typ: e.typ || KLAUSUR_STANDARD[m] || "transfer", dauer: e.dauer || 90 };
}
function klausurSetzen(m, werte) {
  const e = db.get("einst:klausur", {});
  db.set("einst:klausur", { ...e, [m]: { ...e[m], ...werte } });
}
function fristZeile(f, mitKnöpfen) {
  const r = rest(f.ts);
  return `<div class="frist${f.ts - Date.now() < 7 * 864e5 && f.ts > Date.now() ? " bald" : ""}" data-frist="${esc(f.id)}">
    <div class="was"><span class="chip ${f.art}">${ARTEN[f.art] || "Termin"}</span>${f.modul ? ` <span class="muted">${esc(f.modul)}</span>` : ""}
      <b>${esc(f.titel)}</b><span>${langDatum(f.datum)}${f.zeit ? `, ${f.zeit} Uhr` : ""}${f.notiz ? " · " + esc(f.notiz) : ""}${f.plan ? " · aus dem Vorlesungsplan" : ""}</span></div>
    <div class="rest" data-ts="${f.ts}"><b>${r.zahl}</b><span>${r.text}</span></div>
    ${mitKnöpfen && !f.plan ? `<div class="knöpfe"><button class="btn klein" data-bearbeiten="${esc(f.id)}">Bearbeiten</button>
      <button class="btn klein" data-fertig="${esc(f.id)}">${f.erledigt ? "Wieder offen" : "Erledigt"}</button></div>` : ""}</div>`;
}
function countdownHtml(f) {

    <div class="uhrwerk"><div><b>–</b><span>Tage</span></div><div><b>–</b><span>Stunden</span></div><div><b>–</b><span>Minuten</span></div><div><b>–</b><span>Sekunden</span></div></div></div>`;
}
// Countdowns und Uhr laufen sekündlich weiter, ohne die Seite neu aufzubauen.

/* ───────────── Startseite: Uhr, heutiger Plan, Tagesvorschläge, Fristen, To-dos ───────────── */
const startView = document.getElementById("view-start");
const vorlesungen = tag => PLAN.termine.filter(t => t.d === tag);
const minuten = s => +s.slice(0, 2) * 60 + +s.slice(3, 5);

function planListe(tag, jetzt = new Date()) {
  const heute = tag === iso(jetzt), m = jetzt.getHours() * 60 + jetzt.getMinutes();
  const liste = vorlesungen(tag);
  if (!liste.length) return `<p class="muted" style="margin:14px 0 0">${PLAN.tage[tag] ? esc(PLAN.tage[tag]) + ": " : ""}Keine Vorlesungen.</p>`;
  return `<ul class="plan">${liste.map(t => {
    const z = heute && minuten(t.bis) <= m ? "vorbei" : heute && minuten(t.von) <= m ? "läuft" : "";
    return `<li class="${esc(t.art)} ${z}"><div class="von">${t.von}<small>bis ${t.bis}</small></div>
      <div class="was">${esc(t.t)}<small>${[t.art !== "Vorlesung" ? t.art : "", t.raum, t.doz].filter(Boolean).map(esc).join(" · ")}</small></div></li>`;
  }).join("")}</ul>`;
}

// Neuestes Kapitel eines Moduls = Kapitel der letzten Karte/Aufgabe (die Dateien wachsen mit der Vorlesung nach unten).
const kapitelVon = liste => [...new Set(liste.map(x => x.k).filter(Boolean))];
function vorschläge(tag) {
  const rnd = zufall("tag" + tag);
  const kandidaten = [];
  const vorlesungsModule = (von, bis) => [...new Set(PLAN.termine.filter(t => t.m && t.d >= von && t.d <= bis).map(t => t.m))];
  const heute = vorlesungsModule(tag, tag), gestern = vorlesungsModule(tagPlus(tag, -2), tagPlus(tag, -1));
  const morgen = vorlesungsModule(tagPlus(tag, 1), tagPlus(tag, 1));
  const woche = vorlesungsModule(tagPlus(tag, -7), tagPlus(tag, -1));
  const klausuren = fristen().filter(f => f.art === "klausur" && f.modul && f.ts > Date.now());
  const grund = m => {
    const k = klausuren.find(f => f.modul === m);
    const tage = k ? Math.ceil((k.ts - Date.now()) / 864e5) : 99;
    // Transferklausuren brauchen mehr Vorlauf als Abfrageklausuren
    if (tage <= { transfer: 42, gemischt: 35, abfrage: 28 }[klausurInfo(m).typ]) return { p: tage <= 14 ? 5 : 3, text: `Klausur in ${tage} Tagen`, tage };
    if (heute.includes(m)) return { p: 3, text: "heute in der Vorlesung" };
    if (gestern.includes(m)) return { p: 2.6, text: "Vorlesung nacharbeiten" };
    if (morgen.includes(m)) return { p: 2, text: "morgen in der Vorlesung" };
    if (woche.includes(m)) return { p: 1.5, text: "diese Woche dran gewesen" };
    return { p: 0.8, text: "Wiederholen" };
  };
  for (const m of alleModule) {
    const g = grund(m), modul = LERNEN.find(x => x.name === m), deck = DECKS.find(d => d.name === m);
    const jitter = () => g.p + rnd() * 1.2;
    // Klausurtyp gewichtet: Transfer → mehr Rechnen und Probeklausuren, Abfrage → mehr Quiz und Karteikarten
    const typ = klausurInfo(m).typ, bonus = { transfer: { r: 0.4, q: 0, k: 0 }, gemischt: { r: 0.1, q: 0.2, k: 0.2 }, abfrage: { r: -0.6, q: 0.6, k: 0.4 } }[typ];
    const klausurTage = g.tage ?? 99;
    const auf = (modul?.aufgaben || []).filter(a => a.art === "rechnen");
    if (auf.length) {
      const kap = kapitelVon(auf), neu = kap[kap.length - 1];
      // meist aus dem neuesten Kapitel (nacharbeiten), sonst aus älteren (verteilt wiederholen)
      const ausKap = rnd() < 0.6 ? auf.filter(a => a.k === neu) : auf;
      const offen = ausKap.filter(a => aufgabeStand(a)?.s !== "ok");
      const a = wählen(offen.filter(a => aufgabeStand(a)).length && rnd() < 0.5 ? offen.filter(a => aufgabeStand(a)) : offen, rnd) || wählen(ausKap, rnd);
      if (a) kandidaten.push({ key: `aufgabe:${m}:${a.id}`, p: jitter() + 0.3 + bonus.r, modul: m, titel: `Rechenaufgabe: ${a.t}`,
        text: `${m} · ${g.text}${aufgabeStand(a) ? " · " + { ok: "schon gelöst", hilfe: "letztes Mal mit Hilfe", nein: "letztes Mal nicht geschafft" }[aufgabeStand(a).s] : ""}`,
        link: `#lernen/${encodeURIComponent(m)}/aufgabe/${a.id}` });
    }
    if (auf.length >= 5 && typ !== "abfrage") {
      const k = klausurInfo(m), min = Math.round(k.dauer * store.get("probe:tempo", 0.8));
      if (klausurTage <= 28) kandidaten.push({ key: `probe:${m}`, p: g.p + 1 + rnd() * 0.5, modul: m, titel: `Probeklausur ${m}`,
        text: `${min} Minuten unter Zeitdruck · ${g.text}`, los: () => { store.set("lernen:teil", "probe"); location.hash = "#lernen/" + encodeURIComponent(m); } });
      else if (heute.includes(m) || gestern.includes(m) || woche.includes(m)) kandidaten.push({ key: `mix:${m}`, p: jitter() - 0.1 + bonus.r, modul: m,
        titel: `Mix-Serie ${m}`, text: `5 Aufgaben aus verschiedenen Kapiteln · ${g.text}`, los: () => probeStarten(modul, true) });
    }
    if (modul?.quiz?.length) {
      const kap = kapitelVon(modul.quiz), k = morgen.includes(m) || rnd() < 0.5 ? "" : wählen(kap, rnd);
      kandidaten.push({ key: `quiz:${m}:${k}`, p: jitter() - 0.2 + bonus.q, modul: m, titel: `Quiz ${m}${k ? ": " + k : ""}`, text: `10 Fragen · ${g.text}`,
        los: () => quizStarten(modul, { kapitel: k, anzahl: 10, modus: "mix" }) });
    }
    if (deck) {
      const due = zählen(deck).due;
      if (due) kandidaten.push({ key: `fällig:${m}`, p: Math.max(g.p, due >= 10 ? 4.5 : 3) + rnd() * 0.4 + bonus.k,
        modul: m, titel: `${due} fällige Karteikarten ${m} wiederholen`, text: `${m} · Wiederholung nach Plan`,
        los: () => { store.set("karteikarten:kapitel:" + m, ""); location.hash = kartenLink(m); } });
      const kap = kapitelVon(deck.cards), neu = kap[kap.length - 1];
      const st = kartenStand(deck.name), neuOffen = deck.cards.filter(c => c.k === neu && !st[c.id]).length;
      if (neuOffen && (heute.includes(m) || gestern.includes(m)))
        kandidaten.push({ key: `karten:${m}:${neu}`, p: jitter() + bonus.k, modul: m, titel: `Neue Karteikarten ${m}: ${neu}`, text: `${neuOffen} neue Karten · ${g.text}`,
          los: () => { store.set("karteikarten:kapitel:" + m, neu); location.hash = kartenLink(m); } });
    }
  }
  // die vier wichtigsten, höchstens zwei je Modul und je Art nur einmal pro Modul
  kandidaten.sort((a, b) => b.p - a.p);
  const gewählt = [], proModul = {};
  for (const k of kandidaten) {
    if (gewählt.length >= 4) break;
    if (k.modul && (proModul[k.modul] || 0) >= (k.p >= 4 ? 2 : 1)) continue;
    proModul[k.modul] = (proModul[k.modul] || 0) + 1;
    gewählt.push(k);
  }
  // Interleaving: mindestens zwei verschiedene Module am Tag. Sonst den schwächsten Vorschlag durch den besten aus einem anderen Modul ersetzen.
  const module = new Set(gewählt.map(k => k.modul).filter(Boolean));
  const anderes = kandidaten.find(k => k.modul && !module.has(k.modul));
  if (module.size === 1 && anderes) {
    let i = gewählt.length;
    if (i >= 4) while (i > 0 && !gewählt[i - 1].modul) i--;
    if (i >= 4) i--;
    gewählt.splice(i, 1, anderes);
  }

}

function heutigeModule(tag) {
  const start = new Date(tag + "T04:00:00").getTime(), m = new Set();
  for (const anfang of ["aufgabe:", "quiz:"])
    for (const [k, v] of Object.entries(db.objekt(anfang))) if (v.t >= start) m.add(k.split(":")[0]);
  for (const k of Object.keys(db.objekt("probe:"))) if (+k.split(":").pop() >= start) m.add(k.split(":")[0]);
  for (const k of Object.keys(db.get("erledigt:" + tag, {}))) m.add(k.split(":")[1]);
  for (const k of Object.keys(db.get("pomo:" + tag, null)?.module || {})) m.add(k);

}

  document.getElementById("hoerkapitel").onchange = e => { location.hash = hoerLink(m, e.target.value); };
}
// EPUB muss beim Teilen seinen eigenen Dateityp behalten; die PDF-Ansicht ist dafür nicht zuständig.
const epubDateien = new Map();
async function epubSichern(href, knopf) {
  if (knopf.getAttribute("aria-busy") === "true") return;
  const h = DATA.find(m => m.hoeren?.file === href)?.hoeren;
  if (!h) return;
  const original = knopf.dataset.original || knopf.textContent;
  knopf.dataset.original = original;
  const bereich = knopf.closest(".script, .hoertext");
  bereich?.querySelector(".epubstatus")?.remove();
  try {
    let datei = epubDateien.get(href);
    if (!datei) {
      knopf.setAttribute("aria-busy", "true"); knopf.textContent = "Lädt …";
      const antwort = await fetch(href);
      if (!antwort.ok) throw new Error("EPUB nicht erreichbar");
      datei = new File([await antwort.blob()], h.download, { type: "application/epub+zip" });
      epubDateien.set(href, datei);
    }
    if (APP && navigator.share && navigator.canShare?.({ files: [datei] })) {
      try { await navigator.share({ files: [datei] }); }
      catch (err) {
        if (err.name === "NotAllowedError") { knopf.textContent = "Jetzt teilen"; return; }
        if (err.name !== "AbortError") throw err;
      }
    } else {
      const url = APP ? href : URL.createObjectURL(datei);
      const a = Object.assign(document.createElement("a"), { href: url, download: h.download });
      document.body.appendChild(a); a.click(); a.remove();
      if (!APP) setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    knopf.textContent = original;
  } catch {
    knopf.textContent = original;
    const hinweis = document.createElement("p"); hinweis.className = "epubstatus"; hinweis.setAttribute("role", "alert");
    hinweis.textContent = "Die EPUB ließ sich nicht laden. Prüfe die Internetverbindung und tippe erneut auf Herunterladen.";
    bereich?.appendChild(hinweis);
  } finally { knopf.removeAttribute("aria-busy"); }
}
// In der Home-Bildschirm-App öffnet Safari PDFs ohne Zurück-Knopf und kann keine Blob-Downloads.
// Dort zeigt die Seite Lernskripte deshalb in einer eigenen Ansicht (pdf.js) und sichert sie über das Teilen-Menü.
const APP = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/";
const pdfDateiname = href => DATA.find(m => m.file === href)?.download || decodeURIComponent(href.split("/").pop());
const pdfDateien = new Map();                    // href → File, damit ein zweites Tippen sofort teilen kann
async function pdfSichern(href, knopf) {
  const name = pdfDateiname(href), text = knopf.textContent;
  try {
    if (APP && pdfDateien.has(href)) {
      try { await navigator.share({ files: [pdfDateien.get(href)] }); } catch {}
      knopf.textContent = knopf.dataset.text || text; return;
    }
    knopf.textContent = "Lädt …";
    const blob = await (await fetch(href)).blob();
    const datei = typeof File === "function" ? new File([blob], name, { type: "application/pdf" }) : null;
    if (APP && datei && navigator.canShare?.({ files: [datei] })) {
      pdfDateien.set(href, datei);
      try { await navigator.share({ files: [datei] }); knopf.textContent = text; }
      catch (err) {
        // Nach dem Laden ist das Tippen „verbraucht“: dann einmal erneut tippen lassen
        if (err.name === "NotAllowedError") { knopf.dataset.text = text; knopf.textContent = "Jetzt sichern"; }
        else knopf.textContent = text;
      }
      return;
    }
    if (APP) { knopf.textContent = text; pdfOeffnen(href); return; }
    const url = URL.createObjectURL(blob);
    const tmp = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(tmp); tmp.click(); tmp.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    knopf.textContent = text;
  } catch { knopf.textContent = text; if (!APP) location.href = href; }
}
let pdfjs = null, pdfDok = null, pdfBeobachter = null;
function pdfjsLaden() {
  return pdfjs = pdfjs || new Promise((ok, fehler) => {
    const s = Object.assign(document.createElement("script"), { src: PDFJS + "pdf.min.js" });
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(window.pdfjsLib); };
    s.onerror = () => { pdfjs = null; fehler(new Error("pdf.js nicht geladen")); };
    document.head.appendChild(s);
  });
}
const pdfAnsicht = document.getElementById("pdfansicht"), pdfSeiten = document.getElementById("pdfseiten");
async function pdfOeffnen(href, titel) {
  const [datei, anker] = href.split("#");
  const start = +((anker || "").match(/page=(\d+)/) || [])[1] || 1;
  pdfAnsicht.hidden = false; pdfAnsicht.dataset.href = datei;
  document.documentElement.style.overflow = "hidden";
  document.getElementById("pdftitel").textContent = titel || pdfDateiname(datei).replace(/\.pdf$/i, "");
  pdfSeiten.innerHTML = `<p class="pdfinfo">Lädt …</p>`;
  try {
    const lib = await pdfjsLaden();
    pdfZu(true);
    const dok = pdfDok = await lib.getDocument(datei).promise;
    const vp = (await dok.getPage(1)).getViewport({ scale: 1 });
    if (dok !== pdfDok) return;
    pdfSeiten.innerHTML = "";
    for (let i = 1; i <= dok.numPages; i++) {
      const d = Object.assign(document.createElement("div"), { className: "pdfseite" });
      d.dataset.n = i; d.innerHTML = `<div style="padding-top:${vp.height / vp.width * 100}%"></div>`;
      pdfSeiten.appendChild(d);
    }
    // Nur Seiten in der Nähe zeichnen und entfernte wieder freigeben (iPad-Speicher für Canvas ist knapp)
    pdfBeobachter = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? seiteZeichnen(e.target, dok) : seiteFreigeben(e.target)),
      { root: pdfSeiten, rootMargin: "800px 0px" });
    [...pdfSeiten.children].forEach(d => pdfBeobachter.observe(d));
    pdfSeiten.children[start - 1]?.scrollIntoView();
  } catch {
    pdfSeiten.innerHTML = `<p class="pdfinfo">Das Lernskript ließ sich hier nicht anzeigen. Prüf die Internetverbindung und versuch es noch einmal.</p>`;
  }
}
async function seiteZeichnen(d, dok) {
  if (d.dataset.status) return;
  d.dataset.status = "läuft";
  const seite = await dok.getPage(+d.dataset.n);
  const breite = seite.getViewport({ scale: 1 }).width;
  const vp = seite.getViewport({ scale: d.clientWidth / breite * Math.min(2, window.devicePixelRatio || 1) });
  const c = Object.assign(document.createElement("canvas"), { width: Math.floor(vp.width), height: Math.floor(vp.height) });
  await seite.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  if (dok !== pdfDok || d.dataset.status !== "läuft") { c.width = c.height = 0; return; }
  d.dataset.status = "fertig"; d.appendChild(c);
}
function seiteFreigeben(d) {
  const c = d.querySelector("canvas");
  if (c) { c.width = c.height = 0; c.remove(); }
  delete d.dataset.status;
}
function pdfZu(nurDokument) {
  pdfBeobachter?.disconnect(); pdfBeobachter = null;
  pdfSeiten.querySelectorAll("canvas").forEach(c => { c.width = c.height = 0; });
  if (pdfDok) { pdfDok.destroy(); pdfDok = null; }
  if (nurDokument === true) return;
  pdfSeiten.innerHTML = ""; pdfAnsicht.hidden = true;
  document.documentElement.style.overflow = "";
}
document.getElementById("pdfzu").addEventListener("click", () => pdfZu());
document.getElementById("pdfsichern").addEventListener("click", e => pdfSichern(pdfAnsicht.dataset.href, e.currentTarget));
document.addEventListener("click", e => {
  const a = e.isTrusted && e.target.closest("a[href]");   // von Skripten ausgelöste Klicks (Blob-Downloads) durchlassen
  if (!a) return;
  const href = a.getAttribute("href");
  if (a.hasAttribute("data-epub")) { e.preventDefault(); epubSichern(href, a); }
  else if (a.hasAttribute("download")) { e.preventDefault(); pdfSichern(href, a); }
  else if (APP && /\.pdf(#|$)/i.test(href)) {
    e.preventDefault();
    const titel = a.closest(".script")?.querySelector(".title")?.textContent;
    pdfOeffnen(href, titel && "Lernskript " + titel);
  }
});

input.addEventListener("input", () => render(input.value));

/* ───────────── Karteikarten ─────────────
   Wiederholung nach dem Anki-Prinzip (SM-2): Neue Karten durchlaufen zwei Lernschritte in der Runde,
   danach wächst der Abstand mit dem Leichtigkeitsfaktor der Karte (Start 2,5). „Nochmal“ holt die
   Karte in derselben Runde zurück und senkt den Faktor, „Leicht“ hebt ihn. Jede Runde wird neu gemischt.
   Der Stand jeder Karte ist ein synchronisierter Eintrag karte:<Modul>:<id>. */
const TAG = 864e5;
const LERNSCHRITTE = 2;                          // so oft „Gut“, bis eine neue Karte in die Wiederholung kommt
const ABSTAND = { 1: 3, 2: 5, 3: 9 };             // nach so vielen Karten kommt eine Lernkarte in der Runde wieder
const view = document.getElementById("view-lernen");
const kartenStand = name => db.objekt(`karte:${name}:`);
const kartenEinst = () => ({ neu: 20, ...db.get("einst:karten", {}) });
const kartenLink = name => `#lernen/${encodeURIComponent(name)}/karteikarten`;
const einstellungAendern = (k, v) => db.set("einst:karten", { ...kartenEinst(), [k]: v });
let sitzung = null;

// Ein Lerntag beginnt wie bei Anki um 4 Uhr, damit späte Abende noch zum Vortag zählen.
function tagEnde(t = Date.now()) {
  const d = new Date(t - 4 * 36e5);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + TAG + 4 * 36e5;
}
const fällig = (s, jetzt = Date.now()) => s && s.due < tagEnde(jetzt);   // alles, was heute dran ist
function mischen(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function zählen(deck, kapitel) {
  const st = kartenStand(deck.name);
  const karten = deck.cards.filter(c => !kapitel || c.k === kapitel);
  const r = { due: 0, neu: 0, ok: 0, lern: 0, gesamt: karten.length, nächste: Infinity };
  for (const c of karten) {
    const s = st[c.id];
    if (!s) r.neu++;
    else if (fällig(s)) r.due++;
    else { s.typ === "wdh" && s.ivl >= 21 ? r.ok++ : r.lern++; r.nächste = Math.min(r.nächste, s.due); }
  }
  return r;
}

// Was passiert bei Bewertung n (1 Nochmal, 2 Schwer, 3 Gut, 4 Leicht)? Gibt den neuen Zustand zurück.
function planen(s, n, jetzt = Date.now()) {
  s = s ? { ...s } : { typ: "neu", schritt: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const streuen = t => t <= 2 ? t : Math.round(t * (0.95 + Math.random() * 0.1));
  const wiederholung = ivl => Object.assign(s, { typ: "wdh", schritt: 0, ivl, due: tagEnde(jetzt) - TAG + ivl * TAG });
  s.reps++;
  if (s.typ === "wdh") {
    if (n === 1) {
      s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
      Object.assign(s, { typ: "neu-lernen", schritt: 0, ivl: Math.max(1, Math.round(s.ivl * 0.3)), due: jetzt });
    } else if (n === 2) { s.ease = Math.max(1.3, s.ease - 0.15); wiederholung(streuen(Math.max(s.ivl + 1, Math.round(s.ivl * 1.2)))); }
    else if (n === 3) wiederholung(streuen(Math.max(s.ivl + 1, Math.round(s.ivl * s.ease))));
    else { s.ease += 0.15; wiederholung(streuen(Math.max(s.ivl + 2, Math.round(s.ivl * s.ease * 1.3)))); }
    return s;
  }
  // Neue Karte oder Karte im (Neu-)Lernen
  const neuLernen = s.typ === "neu-lernen";
  if (s.typ === "neu") s.typ = "lernen";
  if (n === 1) { s.schritt = 0; s.due = jetzt; }
  else if (n === 2) s.due = jetzt;
  else if (n === 3 && s.schritt + 1 < (neuLernen ? 1 : LERNSCHRITTE)) { s.schritt++; s.due = jetzt; }
  else if (n === 3) wiederholung(neuLernen ? s.ivl : 1);
  else { if (!neuLernen) s.ease += 0.15; wiederholung(neuLernen ? s.ivl + 1 : 4); }
  return s;
}
function dauer(s, jetzt = Date.now()) {
  if (s.typ !== "wdh") return "heute nochmal";
  const t = Math.round((s.due - (tagEnde(jetzt) - TAG)) / TAG);
  if (t <= 1) return "morgen";
  if (t < 30) return `${t} T`;
  if (t < 365) return `${(t / 30).toFixed(t < 300 ? 1 : 0).replace(".", ",")} Mon`;
  return `${(t / 365).toFixed(1).replace(".", ",")} J`;
}

function deckSeite(deck) {
  sitzung = null;
  const einst = kartenEinst();
  const kapitel = [...new Set(deck.cards.map(c => c.k).filter(Boolean))];
  const gewählt = store.get("karteikarten:kapitel:" + deck.name, "");
  const k = kapitel.includes(gewählt) ? gewählt : "";
  const z = zählen(deck, k);
  const nächste = z.nächste < Infinity ? new Date(z.nächste).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) : "";
  view.querySelector("#karteninhalt").innerHTML = `<div class="deckgrid"><div>
    <div class="zahlen"><div class="c-due"><b>${z.due}</b>fällig</div><div class="c-new"><b>${z.neu}</b>neu</div>
      <div class="muted"><b>${z.lern}</b>in Arbeit</div><div class="c-ok"><b>${z.ok}</b>sicher</div></div>
    <div class="panel">
      <div class="row"><label class="l" for="kap">Kapitel</label>
        <select id="kap"><option value="">Alle Kapitel (${deck.cards.length})</option>${kapitel.map(x =>
          `<option${x === k ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="row"><label class="l" for="neu">Neue Karten pro Runde</label>
        <select id="neu">${[5, 10, 20, 30, 1000].map(n => `<option value="${n}"${n === einst.neu ? " selected" : ""}>${n === 1000 ? "alle" : n}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="start"${z.due + z.neu ? "" : " disabled"}>Lernen starten (${z.due + Math.min(z.neu, einst.neu)} Karten)</button>
        <button class="btn" id="nurdue"${z.due ? "" : " disabled"}>Nur fällige (${z.due})</button>
        <button class="btn" id="frei">Frei üben (alle ${z.gesamt} gemischt)</button></div>
      ${z.due + z.neu ? "" : `<p class="muted" style="margin:12px 0 0">Für heute ist alles erledigt.${nächste ? ` Nächste Wiederholung: ${nächste}.` : ""} Mit „Frei üben“ kannst du trotzdem alles durchgehen, ohne den Plan zu ändern.</p>`}
    </div>
    </div><div class="seite">
    <p class="feynman"><b>Feynman-Prinzip:</b> Erklär die Antwort laut und in eigenen, einfachen Worten, als würdest du sie jemandem ohne Vorwissen erklären. Erst dann umdrehen und ehrlich bewerten: Wo deine Erklärung gehakt hat, liegt die Lücke.</p>
    <div class="row" style="margin-top:28px"><button class="link" id="export">Fortschritt sichern</button>
      <button class="link" id="import">Fortschritt laden</button><button class="link" id="reset">Fortschritt zurücksetzen</button></div>
    </div></div>`;
  view.querySelector("#kap").onchange = e => { store.set("karteikarten:kapitel:" + deck.name, e.target.value); deckSeite(deck); };
  view.querySelector("#neu").onchange = e => { einstellungAendern("neu", +e.target.value); deckSeite(deck); };
  view.querySelector("#start").onclick = () => starten(deck, k, "plan");
  view.querySelector("#nurdue").onclick = () => starten(deck, k, "fällig");
  view.querySelector("#frei").onclick = () => starten(deck, k, "frei");
  view.querySelector("#reset").onclick = () => {
    if (!confirm(`Lernfortschritt für ${deck.name} wirklich löschen?`)) return;
    for (const id of Object.keys(kartenStand(deck.name))) db.set(`karte:${deck.name}:${id}`, null);
    deckSeite(deck);
  };
  view.querySelector("#export").onclick = () => {
    const blob = new Blob([JSON.stringify({ modul: deck.name, stand: new Date().toISOString(), karten: kartenStand(deck.name) })], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `Karteikarten ${deck.name} Fortschritt.json` });
    document.body.appendChild(a); a.click(); a.remove();
  };
  view.querySelector("#import").onclick = () => {
    const f = Object.assign(document.createElement("input"), { type: "file", accept: ".json,application/json" });
    f.onchange = async () => {
      try {
        const d = JSON.parse(await f.files[0].text());
        if (d.modul !== deck.name || typeof d.karten !== "object") throw 0;
        for (const [id, s] of Object.entries(d.karten)) db.set(`karte:${deck.name}:${id}`, s);
        deckSeite(deck);
      } catch { alert("Diese Datei passt nicht zu " + deck.name + "."); }
    };
    f.click();
  };
}

// modus: "plan" = fällige + neue, "fällig" = nur fällige, "frei" = alles ohne Plan.
// Jede Runde gehört genau zu einem Modul.
function fälligeKarten(d, kapitel) {
  const st = kartenStand(d.name);
  return d.cards.filter(c => (!kapitel || c.k === kapitel) && fällig(st[c.id])).sort((a, b) => st[a.id].due - st[b.id].due);
}
function starten(deck, kapitel, modus) {
  const frei = modus === "frei", einst = kartenEinst();
  let queue;
  if (!deck) return;
  if (frei) queue = mischen(deck.cards.filter(c => !kapitel || c.k === kapitel));
  else {
    const st = kartenStand(deck.name);
    const neu = modus === "fällig" ? [] : deck.cards.filter(c => (!kapitel || c.k === kapitel) && !st[c.id]).slice(0, einst.neu);
    queue = mischen([...fälligeKarten(deck, kapitel), ...neu]);
  }
  if (!queue.length) return;
  sitzung = { deck, kapitel, frei, modus, queue, gesehen: new Set(), fertig: 0, start: queue.length, stats: { 1: 0, 2: 0, 3: 0, 4: 0 }, umgedreht: false };
  zeigen();
}

function zeigen() {
  const s = sitzung;
  if (!s.queue.length) return ende();
  const c = s.queue[0];
  const st = s.frei ? null : kartenStand(c.d.name)[c.id];
  const zurück = kartenLink(s.deck.name);
  s.umgedreht = false;
  const vorschau = s.frei ? ["heute nochmal", "", "", ""] : [1, 2, 3, 4].map(n => dauer(planen(st, n)));
  const offen = s.queue.length;
  document.body.classList.add("lernen");
  const bilder = (c.i || []).map((b, n) => `<figure class="abb"><button type="button" data-bild="${n}" aria-label="Abbildung groß ansehen">
      <img src="${b.src}" alt="${esc(ohneTags(b.cap))}" loading="lazy"></button>${b.cap ? `<figcaption>${b.cap}</figcaption>` : ""}</figure>`).join("");
  const quelle = c.s ? `<a class="quelle" href="${c.d.pdf}#page=${c.s.p}" target="_blank" rel="noopener"><b>Lernskript S. ${c.s.p}</b>
      <span>${esc(c.s.t)}</span></a>` : "";
  view.innerHTML = `<div class="topbar"><a class="back" href="${zurück}">← ${esc(s.deck.name)}</a>
      <div class="bar"><i style="width:${Math.round(100 * s.fertig / (s.fertig + offen))}%"></i></div>
      <span class="zahl">${s.fertig} / ${s.fertig + offen}</span></div>
    <div class="status"><span>${esc(c.k)}</span>
      <span>${s.frei ? `<span class="mode">Frei üben – ändert den Plan nicht</span>` : !st ? "neue Karte" : st.typ === "wdh" ? "Wiederholung" : "im Lernen"}</span></div>
    <div class="stage"><div class="flash" id="flash">
      <div class="side"><div class="q">${c.q}</div>
        <div class="hint">Erst laut in eigenen Worten erklären, dann antippen zum Umdrehen</div></div>
      <div class="side back-side"><div class="q-small">${c.q}</div>
        <div class="inhalt${bilder ? " mit-bild" : ""}"><div class="a">${c.a}</div>${bilder ? `<div>${bilder}</div>` : ""}</div>
        ${c.b || quelle ? `<div class="fuss">${c.b ? `<div class="merkbild"><b>Merkbild</b>${c.b}</div>` : ""}${quelle}</div>` : ""}</div>
    </div></div>
    <div id="controls"><button class="btn primary flipbtn" id="flip">Antwort zeigen</button></div>`;
  view.querySelectorAll("[data-bild]").forEach(b => b.onclick = e => { e.stopPropagation(); lupe(c.i[+b.dataset.bild]); });
  const flash = view.querySelector("#flash");
  const umdrehen = () => {
    if (s.umgedreht) return;
    s.umgedreht = true;
    flash.classList.add("flipped");
    const namen = s.frei ? ["Nochmal", "Gewusst"] : ["Nochmal", "Schwer", "Gut", "Leicht"];
    view.querySelector("#controls").innerHTML = `<p class="hint" style="margin:0 0 8px">Wie gut konntest du es erklären?</p>
      <div class="grade"${s.frei ? ' style="grid-template-columns:1fr 1fr"' : ""}>${namen.map((n, i) => {
        const note = s.frei ? (i ? 3 : 1) : i + 1;
        return `<button class="g${note}" data-n="${note}">${n}<small>${s.frei ? (i ? "raus aus der Runde" : "kommt gleich wieder") : vorschau[i]}</small></button>`;
      }).join("")}</div>`;
    view.querySelectorAll(".grade button").forEach(b => b.onclick = () => bewerten(+b.dataset.n));
  };
  flash.onclick = e => { if (!e.target.closest("a, button")) umdrehen(); };
  view.querySelector("#flip").onclick = umdrehen;
  // Wischen auf der umgedrehten Karte: links = Nochmal, rechts = Gut
  let x0 = null;
  flash.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  flash.addEventListener("touchend", e => {
    if (x0 === null || !s.umgedreht) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 70) bewerten(dx < 0 ? 1 : 3);
  });
}

function lupe(b) {
  const d = document.createElement("div");
  d.className = "lupe";
  d.innerHTML = `<button class="zu" aria-label="Schließen">×</button><figure><img src="${b.src}" alt="">
    ${b.cap ? `<figcaption>${b.cap}</figcaption>` : ""}</figure>`;
  d.onclick = e => { if (e.target === d || e.target.closest(".zu") || e.target.tagName === "FIGCAPTION") d.remove(); };
  document.body.appendChild(d);
}

function bewerten(n) {
  const s = sitzung;
  if (!s || !s.umgedreht) return;
  const c = s.queue.shift();
  s.stats[n]++;
  let nochmal;
  if (s.frei) nochmal = n === 1;
  else {
    const neu = planen(kartenStand(c.d.name)[c.id], n);
    db.set(`karte:${c.d.name}:${c.id}`, neu);
    nochmal = neu.typ !== "wdh";
  }
  if (nochmal) {
    // In der Runde nach ein paar anderen Karten wiederholen, mit etwas Zufall in der Position.
    const pos = Math.min(s.queue.length, ABSTAND[Math.min(n, 3)] + Math.floor(Math.random() * 3));
    s.queue.splice(pos, 0, c);
  } else s.fertig++;
  zeigen();
}

function ende() {
  const s = sitzung;
  document.body.classList.remove("lernen");
  const nochNeu = s.modus === "plan" && zählen(s.deck, s.kapitel).neu > 0;
  view.innerHTML = `<a class="back" href="${kartenLink(s.deck.name)}">← ${esc(s.deck.name)}</a>
    <div class="panel done"><h2>Runde geschafft 🎉</h2>
      <p class="muted">${s.fertig} Karten erledigt · ${s.stats[1]}× Nochmal${s.frei ? "" : ` · ${s.stats[2]}× Schwer · ${s.stats[3]}× Gut · ${s.stats[4]}× Leicht`}</p>
      <p>Die Karten, bei denen deine Erklärung gehakt hat, kommen bald wieder. Die sicheren erst in einigen Tagen.</p>
      <div class="row">${nochNeu ? `<button class="btn primary" id="mehr">Weitere neue Karten</button>` : ""}
        <button class="btn" id="frei">Frei üben (neu gemischt)</button>
        <a class="btn" href="${kartenLink(s.deck.name)}">Zur Kartenauswahl</a>
        <a class="btn" href="#lernen">Alle Module</a></div></div>`;
  sitzung = null;
  view.querySelector("#mehr")?.addEventListener("click", () => starten(s.deck, s.kapitel, s.modus));
  view.querySelector("#frei")?.addEventListener("click", () => starten(s.deck, s.kapitel, "frei"));
}

document.addEventListener("keydown", e => {
  if (!sitzung || !sitzung.queue.length || e.target.closest("input, select, textarea")) return;
  if ((e.key === " " || e.key === "Enter") && !sitzung.umgedreht) { e.preventDefault(); view.querySelector("#flash")?.click(); }
  else if (/^[1-4]$/.test(e.key) && sitzung.umgedreht) {
    const n = sitzung.frei ? (e.key === "1" ? 1 : 3) : +e.key;
    bewerten(n);
  }
});

// Eine Aufgabe: erst selbst rechnen, dann Tipp, Ergebnis und Lösung Schritt für Schritt aufdecken, am Ende ehrlich bewerten.
let offenAufgabe = null;
function aufgabeSeite(m, a) {
  const liste = (m.aufgaben || []).filter(x => { const f = store.get("lernen:filter", "alle"); return f === "alle" || (f === "offen" ? aufgabeStand(x)?.s !== "ok" || x === a : x.art === f); });

  if (offenAufgabe?.id !== a.id) offenAufgabe = { id: a.id, schritte: 0, tipp: false, erg: false };
  const o = offenAufgabe, st = aufgabeStand(a);
  kopf(m.name, `Lernen · Aufgabe ${i + 1} von ${liste.length}`);
  const link = x => `#lernen/${encodeURIComponent(m.name)}/aufgabe/${x.id}`;
  const fertig = o.schritte >= a.s.length;

      <span class="zahl">${i + 1} / ${liste.length}</span>
      <div class="pfeile"><a class="btn" ${vor ? `href="${link(vor)}"` : "aria-disabled=true style=opacity:.4"} aria-label="vorherige">‹</a>
        <a class="btn" ${nach ? `href="${link(nach)}"` : "aria-disabled=true style=opacity:.4"} aria-label="nächste">›</a></div></div>
    <div class="akarte" style="margin-top:10px">
      <span class="chip ${a.art}">${a.art === "rechnen" ? "Rechenaufgabe" : "Verständnisfrage"}</span> <span class="muted" style="font-size:14px">${esc(a.k)}</span>
      <h2>${esc(a.t)}</h2>
      ${baustein(a.a, a.t)}
      ${o.tipp && a.tipp ? `<div class="extra tipp"><div class="lab">Tipp</div>${baustein(a.tipp, "Tipp")}</div>` : ""}
      ${o.erg && a.erg ? `<div class="extra erg"><div class="lab">Ergebnis zum Vergleichen</div>${baustein(a.erg, "Ergebnis")}</div>` : ""}
      ${a.s.slice(0, o.schritte).map((s, n) => `<div class="schritt"><div class="lab">Schritt ${n + 1} von ${a.s.length}</div>${baustein(s, "Schritt " + (n + 1))}</div>`).join("")}
      ${o.schritte === 0 ? `<p class="feynman" style="margin-top:16px">${a.art === "rechnen" ? "Erst selbst rechnen: Schreib auf, was gegeben und gesucht ist, und überleg, welches Prinzip dahintersteckt. Deck dann Schritt für Schritt auf und vergleiche nach jedem Schritt mit deinem Weg." : "Erklär die Antwort erst laut in eigenen Worten. Deck dann auf und vergleiche."}</p>` : ""}
      <div class="asteuer">
        ${!fertig ? `<button class="btn primary gross" id="weiter">${o.schritte ? `Nächster Schritt (${o.schritte + 1} von ${a.s.length})` : a.s.length > 1 ? `Lösung Schritt für Schritt (${a.s.length} Schritte)` : "Lösung zeigen"}</button>` : ""}
        ${a.tipp && !o.tipp && !o.schritte ? `<button class="btn gross" id="tipp">Tipp</button>` : ""}
        ${a.erg && !o.erg && !fertig ? `<button class="btn gross" id="erg">Ergebnis vergleichen</button>` : ""}
        ${!fertig && a.s.length > 1 ? `<button class="btn gross" id="alle">Alles zeigen</button>` : ""}
      </div>
      ${fertig ? `<p class="hint" style="margin:20px 0 0">Wie lief es?</p><div class="bewerten">
        ${[["ok", "Selbst gelöst", "kommt seltener"], ["hilfe", "Mit Hilfe", "kommt wieder"], ["nein", "Nicht geschafft", "kommt bald wieder"]]
          .map(([k, n, s]) => `<button class="${k}${st?.s === k ? " gewählt" : ""}" data-s="${k}">${n}<small>${s}</small></button>`).join("")}</div>` : ""}
      ${a.q ? `<a class="quelle" href="${m.pdf}#page=${a.q.p}" target="_blank" rel="noopener"><b>Lernskript S. ${a.q.p}</b><span>${esc(a.q.t)}</span></a>` : ""}
    </div>`;
  const neu = () => aufgabeSeite(m, a);
  $("#weiter")?.addEventListener("click", () => { o.schritte++; neu(); lernView.querySelectorAll(".schritt")[o.schritte - 1]?.scrollIntoView({ behavior: "smooth", block: "start" }); });
  $("#tipp")?.addEventListener("click", () => { o.tipp = true; neu(); });
  $("#erg")?.addEventListener("click", () => { o.erg = true; neu(); });
  $("#alle")?.addEventListener("click", () => { o.schritte = a.s.length; neu(); });
  lernView.querySelectorAll(".bewerten button").forEach(b => b.onclick = () => {
    const alt = aufgabeStand(a) || { n: 0 };
    db.set(`aufgabe:${m.name}:${a.id}`, { s: b.dataset.s, n: alt.n + 1, t: Date.now() });
    if (nach) { offenAufgabe = null; location.hash = link(nach); } else { meldung("Gespeichert. Das war die letzte Aufgabe in dieser Liste."); neu(); }
  });

/* Probeklausur: Aufgaben aus möglichst vielen verschiedenen Kapiteln, gemischt, ohne Titel, Kapitel und Tipp, unter Zeitdruck.
   So musst du wie in der Klausur selbst erkennen, welche Methode passt (Interleaving). Die Mix-Serie ist dasselbe mit
   fünf Aufgaben und ohne Uhr. Der laufende Versuch liegt nur auf diesem Gerät (probe:lauf), das Ergebnis wird
   synchronisiert (probe:<Modul>:<Start>), die Bewertung je Aufgabe landet wie sonst unter aufgabe:<Modul>:<id>. */
const aufgabeMinuten = a => a.min || Math.min(30, Math.max(6, 4 + 3 * a.s.length));
function probeZiehen(pool, budget, anzahl) {
  const gewicht = a => ({ nein: 1.8, hilfe: 1.4, ok: 0.45 })[aufgabeStand(a)?.s] || 1;
  const reihe = l => l.map(a => [a, Math.random() * gewicht(a)]).sort((x, y) => y[1] - x[1]).map(x => x[0]);
  // je Kapitel eine Schlange (Unsicheres zuerst), dann reihum ziehen: erst jedes Kapitel einmal, dann ein zweites Mal …
  const schlangen = mischen(kapitelVon(pool)).map(k => reihe(pool.filter(a => a.k === k)));
  const wahl = []; let zeit = 0;
  const voll = () => anzahl ? wahl.length >= anzahl : zeit >= budget * 0.9;
  while (!voll() && schlangen.some(q => q.length)) {
    for (const q of schlangen) {
      if (voll()) break;
      const a = q.shift();
      if (!a || (!anzahl && wahl.length && zeit + aufgabeMinuten(a) > budget * 1.1)) continue;
      wahl.push(a); zeit += aufgabeMinuten(a);
    }
  }
  return wahl;
}
function probeStarten(m, mix) {
  const k = klausurInfo(m.name), tempo = store.get("probe:tempo", 0.8), auf = m.aufgaben || [];
  const rechnen = auf.filter(a => a.art === "rechnen"), verstehen = auf.filter(a => a.art === "verstehen");
  let wahl;
  if (mix) wahl = probeZiehen(rechnen, 0, 5);
  else {
    const dauer = Math.round(k.dauer * tempo);
    // Bei gemischten und Abfrageklausuren ein Teil der Zeit für Verständnisfragen
    const anteil = verstehen.length ? { transfer: 0.1, gemischt: 0.3, abfrage: 0.5 }[k.typ] : 0;
    wahl = probeZiehen(rechnen, dauer * (1 - anteil));
    const rest = dauer - wahl.reduce((n, a) => n + aufgabeMinuten(a), 0);
    if (rest >= 5 && verstehen.length) wahl = wahl.concat(probeZiehen(verstehen, rest));
  }
  if (!wahl.length) return meldung("Keine passenden Aufgaben gefunden.");
  const jetzt = Date.now(), dauer = mix ? 0 : Math.round(k.dauer * tempo);
  store.set("probe:lauf", { modul: m.name, ids: mischen(wahl).map(a => a.id), start: jetzt, dauer, ende: mix ? 0 : jetzt + dauer * 6e4,
    klausur: k.dauer, tempo, mix: !!mix, ab: 0, bew: {}, erg: {} });
  location.hash = `#lernen/${encodeURIComponent(m.name)}/probe`;
}
function probeEinstellungen(m) {
  const k = klausurInfo(m.name), tempo = store.get("probe:tempo", 0.8), lauf = store.get("probe:lauf", null);
  const alt = Object.entries(db.objekt(`probe:${m.name}:`)).sort((a, b) => b[0] - a[0]).slice(0, 6);
  const seg = (id, liste, aktiv) => `<div class="seg" id="${id}">${liste.map(([v, n]) => `<button data-v="${v}" aria-pressed="${v == aktiv}">${n}</button>`).join("")}</div>`;
  return `<div class="zwei"><div class="panel"><h2>Probeklausur</h2>
      <p style="margin-top:0">Aufgaben aus verschiedenen Kapiteln, gemischt und ohne Überschrift, mit Uhr. Wie in der Klausur erkennst du selbst, welche Methode passt.</p>
      ${lauf && lauf.modul === m.name ? `<div class="row" style="margin-bottom:12px"><a class="btn${lauf.ab ? "" : " primary gross"}" href="#lernen/${encodeURIComponent(m.name)}/probe">${lauf.ab ? "Letzte Auswertung öffnen" : (lauf.mix ? "Mix-Serie" : "Probeklausur") + " fortsetzen"}</a></div>` : ""}
      <div class="row"><label class="l">Klausurdauer</label>${seg("pdauer", [60, 90, 120, 180].map(n => [n, n + " min"]), k.dauer)}</div>
      <div class="row"><label class="l">Tempo</label>${seg("ptempo", [[0.8, "80 % der Zeit"], [1, "volle Zeit"]], tempo)}</div>
      <div class="row"><label class="l">Klausurtyp</label>${seg("ptyp", Object.entries(KLAUSURTYPEN), k.typ)}</div>
      <p class="muted" style="margin:14px 0 0">Du hast <b>${Math.round(k.dauer * tempo)} Minuten</b>. ${k.typ === "transfer" ? "Fast nur Rechenaufgaben." : k.typ === "gemischt" ? "Rechenaufgaben und ein Teil Verständnisfragen." : "Etwa die Hälfte Verständnisfragen."}

/* Quiz: Einfachauswahl (sofortige Rückmeldung mit Erklärung zu jeder Antwort), Mehrfachauswahl (prüfen),
   Lückentext und Freitext (werden wie bei NotebookLM am Ende bewertet; Freitext bewertest du selbst). */
let quizRunde = null;
const quizZurück = q => q.m.abschluss ? "#start" : `#lernen/${encodeURIComponent(q.m.name)}`;
function quizStarten(m, { kapitel = "", anzahl = 10, modus = "mix" } = {}) {
  let pool = (m.quiz || []).filter(f => !kapitel || f.k === kapitel);
  if (modus === "falsch") pool = pool.filter(f => quizStand(f) && !quizStand(f).ok);
  if (modus === "neu") pool = pool.filter(f => !quizStand(f));
  if (!pool.length) return meldung(modus === "falsch" ? "Keine falsch beantworteten Fragen – stark!" : "Keine passenden Fragen.");
  // Bevorzugt, was noch nicht sitzt: falsch beantwortete und neue vor sicheren
  const gewicht = f => { const s = quizStand(f); return !s ? 1 : s.ok ? 0.35 : 1.6; };
  pool = pool.map(f => [f, Math.random() * gewicht(f)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const fragen = pool.slice(0, anzahl || pool.length).map(f => ({ f, o: f.o ? mischen(f.o.map((x, i) => ({ ...x, i }))) : null }));
  quizRunde = { m, fragen, i: 0, antw: fragen.map(() => null), fertig: false, ziel: { kapitel, anzahl, modus } };
  const ziel = `#lernen/${encodeURIComponent(m.name)}/quiz`;
  location.hash === ziel ? route() : location.hash = ziel;
}
const normal = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/[^a-z0-9,.\-+ ]/g, "").replace(/\s+/g, " ").trim().replace(/[.]$/, "");
function abstand(a, b) {
  const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    let alt = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, alt + (a[i - 1] === b[j - 1] ? 0 : 1)); alt = t; }

const lückeRichtig = (f, werte) => werte.every((w, i) => {

  return x && gültig.some(g => g === x || (g.length > 5 && abstand(g, x) <= 1));

function quizSpeichern(f, ok) {
  const alt = quizStand(f) || { r: 0, f: 0 };

}
function quizSeite() {

  const beantwortet = a && (a.geprüft || f.typ === "lücke" || f.typ === "frei");
  let körper = "";
  if (f.typ === "einfach" || f.typ === "mehrfach") {
    const geprüft = a?.geprüft, mehr = f.typ === "mehrfach";

      const gewählt = a?.wahl?.includes(n);

        ${urteil ? `<span class="urteil">${urteil}</span>` : ""}${geprüft && x.e ? `<span class="erkl">${x.e}</span>` : ""}</button>`;

    <div class="qkarte"><div class="qnr">${q.i + 1} von ${q.fragen.length}${f.k ? ` · ${esc(f.k)}` : ""}</div>
      <div class="qfrage">${frage}</div>${körper}

        ${f.tipp && !(a?.geprüft) ? `<button class="btn" id="qtipp">Tipp ▾</button>` : ""}

        <div class="rechts">${q.i ? `<button class="btn" id="qzurück">Zurück</button>` : ""}
          ${f.typ === "mehrfach" && !a?.geprüft ? `<button class="btn primary" id="qprüfen"${a?.wahl?.length ? "" : " disabled"}>Antwort prüfen</button>`

  const extra = (html, kl) => { $("#qextra").innerHTML = `<div class="qextra ${kl}">${html}</div>`; };

  $("#qerkl")?.addEventListener("click", () => extra((f.erkl || "") + (f.s ? `<a class="quelle" href="${f.m.pdf}#page=${f.s.p}" target="_blank" rel="noopener"><b>Lernskript S. ${f.s.p}</b><span>${esc(f.s.t)}</span></a>` : ""), "erkl"));
  lernView.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const n = +b.dataset.o;

    } else {

    if (f.typ === "lücke") q.antw[q.i] = { werte: [...lernView.querySelectorAll("[data-l]")].map(i => i.value) };

  };

    if (q.i + 1 < q.fragen.length) { q.i++; quizSeite(); }

        if (f.typ === "lücke") { const r = lückeRichtig(f, q.antw[n]?.werte || []); q.antw[n] = { ...q.antw[n], richtig: r }; quizSpeichern(f, r); }

function quizAuswertung() {
