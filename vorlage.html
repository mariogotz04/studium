/* Pomodoro: Lernzeit und Pausen einstellbar. Der Timer rechnet mit der Endzeit, läuft also auch weiter,
   wenn die Seite kurz im Hintergrund ist. Einstellungen werden synchronisiert, der laufende Timer nicht. */
const pomodoro = {
  einst() { return { lern: 25, pause: 5, lang: 15, runden: 4, auto: true, ...db.get("einst:pomodoro", {}) }; },
  z: store.get("pomo:lauf", { phase: "lern", ende: null, rest: null, runde: 1 }),
  speichern() { store.set("pomo:lauf", this.z); },
  dauer(p = this.z.phase) { return this.einst()[p] * 6e4; },
  läuft() { return !!this.z.ende; },
  übrig() { return this.z.ende ? Math.max(0, this.z.ende - Date.now()) : this.z.rest ?? this.dauer(); },
  anzeige(ms = this.übrig()) { const s = Math.ceil(ms / 1e3); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; },
  phaseName(p = this.z.phase) { return { lern: "Lernzeit", pause: "Kurze Pause", lang: "Lange Pause" }[p]; },
  start() { this.ton(true); this.z.ende = Date.now() + this.übrig(); this.z.rest = null; this.speichern(); this.wach(true); },
  anhalten() { this.z.rest = this.übrig(); this.z.ende = null; this.speichern(); this.wach(false); },
  zurück() { this.z = { phase: "lern", ende: null, rest: null, runde: 1, modul: this.z.modul }; this.speichern(); this.wach(false); },
  weiter(automatisch) {
    const e = this.einst();
    if (this.z.phase === "lern") {
      if (automatisch) {   // eine volle Lerneinheit ins Tagesprotokoll
        const k = "pomo:" + heuteIso(), p = db.get(k, { n: 0, min: 0 });
        db.set(k, { n: p.n + 1, min: p.min + e.lern, module: { ...(p.module || {}), ...(this.z.modul ? { [this.z.modul]: ((p.module || {})[this.z.modul] || 0) + e.lern } : {}) } });
      }
      this.z.phase = this.z.runde % e.runden === 0 ? "lang" : "pause";
    } else { this.z.phase = "lern"; this.z.runde++; }
    this.z.rest = null;
    this.z.ende = automatisch && e.auto ? Date.now() + this.dauer() : null;
    this.speichern();
  },
  tick() {
    if (this.z.ende && Date.now() >= this.z.ende) {
      const war = this.z.phase;
      this.weiter(true); this.ton(); navigator.vibrate?.([200, 100, 200]);
      meldung(war === "lern" ? "Lernzeit vorbei – Zeit für eine Pause." : "Pause vorbei – weiter geht's!", 6000);
      if (!this.z.ende) this.wach(false);
      if (location.hash === "#lernen/pomodoro") pomodoroSeite();
    }
    const p = $("#pomopille");
    p.hidden = !this.z.ende || location.hash === "#lernen/pomodoro" || document.body.classList.contains("lernen");
    if (!p.hidden) { p.textContent = `${this.z.phase === "lern" ? "🍅" : "☕"} ${this.anzeige()}`; p.className = "pomopille" + (this.z.phase === "lern" ? "" : " pause"); }
    if (location.hash === "#lernen/pomodoro") {
      const b = $("#pomozeit"); if (b) b.textContent = this.anzeige();
      const c = $("#pomoring"); if (c) c.style.strokeDashoffset = (1 - this.übrig() / this.dauer()) * 1068;
    }
  },
  ctx: null,
  ton(nurFreischalten) {   // Glockenton; der erste Tipp auf Start schaltet den Ton in Safari frei
    try {
      this.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
      if (nurFreischalten) return;
      [0, 0.35, 0.7].forEach((t, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), s = this.ctx.currentTime + t;
        o.frequency.value = [880, 660, 990][i]; o.type = "sine";
        g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.4, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.6);
        o.connect(g).connect(this.ctx.destination); o.start(s); o.stop(s + 0.65);
      });
    } catch {}
  },
  sperre: null,
  async wach(an) {   // Bildschirm bleibt an, solange der Timer läuft (iPad liegt beim Lernen daneben)
    try { if (an && !this.sperre) this.sperre = await navigator.wakeLock?.request("screen"); else if (!an) { await this.sperre?.release(); this.sperre = null; } } catch {}
  },
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && pomodoro.läuft()) { pomodoro.sperre = null; pomodoro.wach(true); } });

function pomodoroSeite() {
  const e = pomodoro.einst(), z = pomodoro.z, tag = db.get("pomo:" + heuteIso(), null);
  kopf("Pomodoro-Timer", `${pomodoro.phaseName()} · Runde ${z.runde}`);
  const stepper = (k, name, min, max, schritt) => `<div class="stepper"><span>${name}</span><div class="w">
    <button data-k="${k}" data-d="${-schritt}" aria-label="weniger">−</button><b>${e[k]}${k === "runden" ? "" : " min"}</b>
    <button data-k="${k}" data-d="${schritt}" data-max="${max}" data-min="${min}" aria-label="mehr">+</button></div></div>`;
  lernView.innerHTML = `<a class="back" href="#lernen">← Lernen</a><div class="pomo"><div class="panel" style="text-align:center">
      <div class="seg" style="margin-bottom:6px">${["lern", "pause", "lang"].map(p => `<button data-p="${p}" aria-pressed="${z.phase === p}">${pomodoro.phaseName(p)}</button>`).join("")}</div>
      <div class="ring${z.phase === "lern" ? "" : " pause"}"><svg viewBox="0 0 360 360"><circle class="spur" cx="180" cy="180" r="170"/>
        <circle class="lauf" id="pomoring" cx="180" cy="180" r="170" stroke-dasharray="1068" style="stroke-dashoffset:${(1 - pomodoro.übrig() / pomodoro.dauer()) * 1068}"/></svg>
        <div class="mitte"><b id="pomozeit">${pomodoro.anzeige()}</b><span>${pomodoro.phaseName()} · Runde ${z.runde} von ${e.runden}</span></div></div>
      <div class="pomoknöpfe">${pomodoro.läuft() ? `<button class="btn primary gross" id="pstop">Pause</button>` : `<button class="btn primary gross" id="pstart">${z.rest != null ? "Weiter" : "Start"}</button>`}
        <button class="btn gross" id="pskip">Überspringen</button><button class="btn gross" id="preset">Zurücksetzen</button></div>
      <div class="row" style="justify-content:center;margin-top:14px"><label class="l" for="pmodul">Ich lerne</label>
        <select id="pmodul"><option value="">–</option>${alleModule.map(m => `<option${m === z.modul ? " selected" : ""}>${esc(m)}</option>`).join("")}</select></div>
    </div><div>
      <div class="panel"><h2>Einstellungen</h2>
        ${stepper("lern", "Lernzeit", 5, 120, 5)}${stepper("pause", "Kurze Pause", 1, 30, 1)}${stepper("lang", "Lange Pause", 5, 60, 5)}${stepper("runden", "Lange Pause nach … Runden", 2, 8, 1)}
        <label class="schalter"><input type="checkbox" id="pauto"${e.auto ? " checked" : ""}> Nächste Phase automatisch starten</label></div>
      <div class="panel"><h2>Heute</h2><p style="margin:0">${tag ? `<b>${tag.n}</b> Lerneinheit${tag.n === 1 ? "" : "en"}, <b>${tag.min}</b> Minuten konzentriert gelernt.` : "Noch keine abgeschlossene Lerneinheit."}</p>
        ${tag?.module ? `<p class="muted" style="margin:6px 0 0">${Object.entries(tag.module).map(([m, n]) => `${esc(m)}: ${n} min`).join(" · ")}</p>` : ""}
        <p class="feynman" style="margin-top:12px">In der Pause wirklich weg vom Stoff: aufstehen, trinken, aus dem Fenster schauen. Danach in einem Satz sagen, was du gerade gelernt hast.</p></div>
    </div></div>`;
  $("#pstart")?.addEventListener("click", () => { pomodoro.start(); pomodoroSeite(); });
  $("#pstop")?.addEventListener("click", () => { pomodoro.anhalten(); pomodoroSeite(); });
  $("#pskip").onclick = () => { const lief = pomodoro.läuft(); pomodoro.weiter(false); if (lief) pomodoro.start(); pomodoroSeite(); };
  $("#preset").onclick = () => { pomodoro.zurück(); pomodoroSeite(); };
  $("#pmodul").onchange = ev => { pomodoro.z.modul = ev.target.value; pomodoro.speichern(); };
  lernView.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    Object.assign(pomodoro.z, { phase: b.dataset.p, ende: null, rest: null }); pomodoro.speichern(); pomodoro.wach(false); pomodoroSeite();
  });
  lernView.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
    const k = b.dataset.k, grenzen = { lern: [5, 120], pause: [1, 30], lang: [5, 60], runden: [2, 8] }[k];
    const v = Math.min(grenzen[1], Math.max(grenzen[0], e[k] + +b.dataset.d));
    db.set("einst:pomodoro", { ...e, [k]: v });
    if (!pomodoro.läuft() && pomodoro.z.rest == null) pomodoro.speichern();
    pomodoroSeite();
  });
  $("#pauto").onchange = ev => db.set("einst:pomodoro", { ...e, auto: ev.target.checked });
}

/* ───────────── Konto: Synchronisation einrichten ───────────── */
const kontoView = document.getElementById("view-konto");
let kontoHinweis = "";
function kontoSeite() {
  kopf("Synchronisation", auth.s ? "Deine Daten gleichen sich zwischen deinen Geräten ab" : "Einmal pro Gerät anmelden");
  const offen = sync.offen.size;
  kontoView.innerHTML = `<div class="zwei" style="margin-top:18px"><div class="panel">${auth.s ? `
      <h2>Angemeldet</h2><p style="margin:0">als <b>${esc(auth.email())}</b></p>
      <p class="muted">${sync.zustand === "fehler" ? `Gerade kein Abgleich möglich (${esc(sync.fehler)}). Deine Änderungen bleiben auf diesem Gerät und gehen später automatisch raus.` :
        sync.zuletzt ? `Zuletzt abgeglichen: ${new Date(sync.zuletzt).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}` : "Noch kein Abgleich."}
        ${offen ? ` · ${offen} Änderung${offen === 1 ? "" : "en"} warten auf den Upload.` : ""}</p>
      <div class="row"><button class="btn primary" id="jetzt">Jetzt abgleichen</button><button class="link" id="abmelden">Abmelden</button></div>
      <h2 style="margin-top:26px">${store.get("auth:passwort", false) ? "Passwort ändern" : "Passwort festlegen"}</h2>
      <p class="muted" style="margin-top:0">Damit meldest du dich auf deinen anderen Geräten mit E-Mail und Passwort an, ohne Link.</p>
      <form id="pwsetzen" class="formular">
        <input type="email" name="username" autocomplete="username" value="${esc(auth.email())}" hidden>
        <label>Neues Passwort<input type="password" id="pwneu" required minlength="8" autocomplete="new-password"></label>
        <label>Wiederholen<input type="password" id="pwneu2" required minlength="8" autocomplete="new-password"></label>
        <div class="ganz row"><button class="btn primary">Passwort speichern</button></div></form>`
    : `<h2>Anmelden</h2><p style="margin-top:0">Mit deinem Konto ist dein Lernstand auf iPad, iPhone und Mac derselbe. Auf jedem Gerät meldest du dich einmal an.</p>
      <form id="pwanmelden" class="formular">
        <label class="ganz">E-Mail<input type="email" id="pwemail" name="username" required placeholder="name@beispiel.de" autocomplete="username" value="${esc(store.get("auth:email", ""))}"></label>
        <label class="ganz">Passwort<input type="password" id="pwwort" name="password" required autocomplete="current-password"></label>
        <div class="ganz row"><button class="btn primary">Anmelden</button></div></form>
      <details style="margin-top:18px"><summary style="min-height:44px;cursor:pointer;color:var(--accent);font-weight:600">Noch kein Passwort oder vergessen?</summary>
        <p class="muted">Lass dir einen Anmeldelink schicken. Nach der Anmeldung legst du hier dein Passwort fest.</p>
      <form id="anmelden" class="row"><input type="email" id="email" required placeholder="name@beispiel.de" autocomplete="email" style="flex:1 1 240px" value="${esc(store.get("auth:email", ""))}">
        <button class="btn">Link senden</button></form></details>
      <details style="margin-top:18px"><summary style="min-height:44px;cursor:pointer;color:var(--accent);font-weight:600">Die Seite liegt als App auf dem Home-Bildschirm?</summary>
        <p class="muted">Dann öffnet der Link Safari statt der App. Drück in der E-Mail lange auf den Link, wähle „Link kopieren“ und füge ihn hier ein:</p>
        <form id="einlösen" class="row"><input type="text" id="link" placeholder="https://…supabase.co/auth/v1/verify?token=…" style="flex:1 1 240px" autocomplete="off">
          <button class="btn primary">Anmelden</button></form></details>`}
      ${kontoHinweis ? `<p style="color:var(--accent);font-weight:600">${esc(kontoHinweis)}</p>` : ""}</div>
    <div class="panel"><h2>Was wird abgeglichen?</h2>
      <p style="margin-top:0">Karteikarten-Fortschritt, gelöste Aufgaben, Quiz-Ergebnisse, Fristen, To-dos, abgehakte Tagesvorschläge und die Einstellungen von Karteikarten und Pomodoro-Timer.</p>
      <p class="muted">Alles bleibt zusätzlich auf jedem Gerät gespeichert, die Seite funktioniert also auch offline. Sobald wieder Netz da ist, gleicht sie sich ab. Wurde derselbe Eintrag auf zwei Geräten geändert, gilt die neuere Änderung.</p>
      <p class="muted" style="margin-bottom:0">Gespeichert wird bei Supabase (Server in Frankfurt). Nur du siehst deine Einträge.</p></div></div>`;
  $("#pwanmelden")?.addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#pwemail").value.trim(); store.set("auth:email", email);
    try { await auth.passwortAnmelden(email, $("#pwwort").value); store.set("auth:passwort", true); kontoHinweis = "Angemeldet. Deine Daten werden jetzt abgeglichen."; sync.jetzt(); }
    catch (err) { kontoHinweis = "Das hat nicht geklappt: " + err.message; }
    kontoSeite();
  });
  $("#pwsetzen")?.addEventListener("submit", async e => {
    e.preventDefault();
    if ($("#pwneu").value !== $("#pwneu2").value) { kontoHinweis = "Die beiden Passwörter sind nicht gleich."; return kontoSeite(); }
    try { await auth.passwortSetzen($("#pwneu").value); kontoHinweis = "Passwort gespeichert. Auf deinen anderen Geräten meldest du dich jetzt mit E-Mail und Passwort an."; }
    catch (err) { kontoHinweis = "Das hat nicht geklappt: " + err.message; }
    kontoSeite();
  });
  $("#anmelden")?.addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#email").value.trim(); store.set("auth:email", email);
    try { await auth.linkSenden(email); kontoHinweis = `Link ist unterwegs an ${email}. Öffne ihn auf diesem Gerät.`; }
    catch (err) { kontoHinweis = "Das hat nicht geklappt: " + err.message; }
    kontoSeite();
  });
  $("#einlösen")?.addEventListener("submit", async e => {
    e.preventDefault();
    try { await auth.linkEinlösen($("#link").value); kontoHinweis = "Angemeldet."; sync.jetzt(); }
    catch (err) { kontoHinweis = "Das hat nicht geklappt: " + err.message; }
    kontoSeite();
  });
  $("#jetzt")?.addEventListener("click", () => sync.jetzt());
  $("#abmelden")?.addEventListener("click", () => {
    if (!confirm("Abmelden? Deine Daten bleiben auf diesem Gerät, werden aber nicht mehr abgeglichen.")) return;
    auth.s = null; kontoHinweis = ""; sync.anzeigen("aus");
  });
}

/* ───────────── Navigation ───────────── */
const VIEWS = { start: "view-start", skripte: "view-skripte", hoeren: "view-hoeren", lernen: "view-lernen", termine: "view-termine", konto: "view-konto" };
function route(oben = true) {
  const h = decodeURIComponent(location.hash.slice(1));
  const [teil, ...rest] = h.split("/");
  // Alte Lesezeichen führen zur Kartenauswahl im jeweiligen Modul.
  if (teil === "karteikarten") {
    const name = rest.join("/");
    location.replace(name && DECKS.some(d => d.name === name) ? kartenLink(name) : "#lernen");
    return;
  }
  const r = VIEWS[teil] ? teil : "start";
  document.body.classList.remove("lernen");
  document.querySelector(".lupe")?.remove();
  for (const [k, id] of Object.entries(VIEWS)) document.getElementById(id).hidden = k !== r;
  document.querySelectorAll("#tabs a").forEach(a => a.dataset.r === (r === "hoeren" ? "skripte" : r) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  sitzung = null;
  if (!(r === "lernen" && (rest[1] === "quiz" || rest[0] === "abschluss"))) quizRunde = null;
  if (r === "start") startSeite();
  else if (r === "skripte") kopf("Meine Lernskripte", `${DATA.length} Module · PDF-Lernskripte und EPUB-Hörzusammenfassungen`);
  else if (r === "hoeren") hoerSeite(DATA.find(m => m.name === rest[0]), rest[1]);
  else if (r === "termine") termineSeite();
  else if (r === "konto") kontoSeite();
  else if (r === "lernen") {
    const m = LERNEN.find(x => x.name === rest[0]);
    if (rest[0] === "pomodoro") pomodoroSeite();
    else if (rest[0] === "abschluss") quizRunde?.m.abschluss ? quizSeite() : (location.hash = "#start");
    else if (!m) lernenÜbersicht();
    else if (rest[1] === "aufgabe" && m.aufgaben?.find(a => a.id === rest[2])) aufgabeSeite(m, m.aufgaben.find(a => a.id === rest[2]));
    else if (rest[1] === "quiz" && quizRunde?.m === m) quizSeite();
    else if (rest[1] === "probe") store.get("probe:lauf", null)?.modul === m.name ? probeSeite(m) : modulSeite(m, "probe");
    else modulSeite(m, rest[1]);
  }
  pomodoro.tick();
  if (oben) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
// Links auf die gerade offene Adresse (z. B. Zurück aus einer Runde): selbst neu aufbauen.
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (a && a.hash === location.hash) { e.preventDefault(); route(); }
});
const rückkehr = auth.ausAdresse();
if (rückkehr) kontoHinweis = rückkehr === "ok" ? "Angemeldet. Deine Daten werden jetzt abgeglichen." : "Anmeldung fehlgeschlagen: " + rückkehr;
// Alte Adresse der Lernskript-Liste (#) zeigt jetzt die Startseite; Lernskripte liegen unter #skripte.
sync.anzeigen(auth.s ? "an" : "aus");
route();
sync.jetzt();
</script>
</body>
