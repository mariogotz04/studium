<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernen">
<title>Meine Lernskripte</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23244f70'/><path d='M9 8h10l4 4v12H9z' fill='white'/><path d='M12 16h8M12 20h6' stroke='%23244f70' stroke-width='2'/></svg>">
<style>
:root {
  --bg: #f6f8fa; --card: #ffffff; --ink: #1f2a33; --muted: #62717d; --line: #dfe6ec;
  --accent: #244f70; --accent-ink: #ffffff; --accent-soft: #e8f0f6; --teal: #16746d;
  --again: #b3392f; --hard: #a86412; --good: #16746d; --easy: #2b5fa8; --bild: #fbf6e9; --bild-line: #e8d9ae;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161b; --card: #1a2128; --ink: #e4eaef; --muted: #93a2ae; --line: #2a343d;
          --accent: #7fb3d9; --accent-ink: #0d1820; --accent-soft: #1f2d39; --teal: #5cc2b3;
          --again: #ec8178; --hard: #e3a75a; --good: #5cc2b3; --easy: #86aef0; --bild: #252219; --bild-line: #4a4126; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 40px 16px 64px; }
header h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -0.02em; }
header p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin: 24px 0 0; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 14px; font-weight: 600; color: var(--muted); text-decoration: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.search { margin: 20px 0 16px; width: 100%; padding: 12px 14px; font-size: 16px; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.script { display: flex; gap: 16px; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
.script .title { font-weight: 700; font-size: 18px; }
.script .sub { margin-top: 1px; }
.script .stand { color: var(--teal); font-weight: 600; }
.script .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
.btn { display: inline-block; padding: 8px 14px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600;
  text-decoration: none; border: 1px solid var(--accent); color: var(--accent); background: none;
  white-space: nowrap; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--muted);
  text-decoration: underline; cursor: pointer; }
.empty { color: var(--muted); margin-top: 32px; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }

/* Karteikarten */
.intro { color: var(--muted); margin: 20px 0 16px; }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin-top: 4px; }
.counts b { font-variant-numeric: tabular-nums; }
.c-due { color: var(--again); } .c-new { color: var(--easy); } .c-ok { color: var(--good); }
.back { display: inline-block; margin: 20px 0 8px; color: var(--accent); text-decoration: none; font-weight: 600; }
.deckhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.deckhead h2 { margin: 0; font-size: 24px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 12px; }
select { font: inherit; font-size: 15px; padding: 7px 10px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
label.l { font-size: 14px; color: var(--muted); }
.feynman { font-size: 14px; color: var(--muted); border-left: 3px solid var(--teal); padding: 2px 0 2px 10px; margin: 0; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 16px 0 6px; }
.bar i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.status { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
/* Lernrunde: aufs iPad zugeschnitten (nur Finger), Karte füllt den Bildschirm */
body.lernen header, body.lernen .tabs { display: none; }
body.lernen .wrap { max-width: 1040px; padding: max(14px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
  min-height: 100dvh; display: flex; flex-direction: column; }
body.lernen #view-karten { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 14px; }
.topbar .back { margin: 0; padding: 10px 4px; min-height: 44px; display: flex; align-items: center; white-space: nowrap; }
.topbar .bar { flex: 1; margin: 0; }
.topbar .zahl { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.status { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 2px; }
.stage { perspective: 2000px; margin: 12px 0 14px; flex: 1; min-height: 360px; display: flex; }
.flash { position: relative; flex: 1; transform-style: preserve-3d; transition: transform .45s; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.flash.flipped { transform: rotateY(180deg); cursor: default; }
.side { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 28px 22px;
  display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch;
  box-shadow: 0 8px 30px rgba(20, 40, 60, .08); }
.side.back-side { transform: rotateY(180deg); }
.chap { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.side .q { font-size: clamp(22px, 3.2vw, 32px); font-weight: 650; line-height: 1.3; margin: auto 0; padding: 24px 4%;
  text-align: center; text-wrap: balance; }
.side .q-small { font-size: 18px; font-weight: 650; margin: 8px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.inhalt { display: grid; gap: 18px 26px; align-items: start; }
.inhalt.mit-bild { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.side .a { font-size: 19px; line-height: 1.55; }
.side .a p { margin: 0 0 12px; }
.side .a ul { margin: 0 0 12px; padding-left: 24px; }
.side .a li { margin-bottom: 4px; }
.side .a code { font-size: .92em; background: var(--accent-soft); padding: 1px 4px; border-radius: 4px; }
figure.abb { margin: 0; }
figure.abb button { display: block; width: 100%; padding: 10px; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
figure.abb img { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; }
figure.abb figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
figure.abb + figure.abb { margin-top: 14px; }
.fuss { margin-top: auto; padding-top: 16px; display: grid; gap: 10px; }
.merkbild { background: var(--bild); border: 1px solid var(--bild-line); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.merkbild b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.quelle { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-height: 48px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 600; }
.quelle span { font-weight: 400; color: var(--muted); }
.quelle::after { content: "›"; margin-left: auto; font-size: 22px; line-height: 1; }
.hint { text-align: center; font-size: 15px; color: var(--muted); }
.mode { font-size: 12px; font-weight: 600; color: var(--hard); }
#controls { padding-bottom: 4px; }
.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grade button { font: inherit; font-size: 19px; border-radius: 14px; min-height: 76px; padding: 10px 4px; cursor: pointer;
  background: var(--card); border: 2px solid currentColor; font-weight: 700; line-height: 1.25;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.grade button:active { transform: scale(.97); }
.grade button small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); margin-top: 2px; }
.grade .g1 { color: var(--again); } .grade .g2 { color: var(--hard); } .grade .g3 { color: var(--good); } .grade .g4 { color: var(--easy); }
.flipbtn { width: 100%; min-height: 76px; font-size: 20px; border-radius: 14px; touch-action: manipulation; }
.done h2 { margin: 0 0 6px; }
.muted { color: var(--muted); }
/* Bild groß ansehen: antippen öffnet, Finger zum Zoomen, antippen schließt */
.lupe { position: fixed; inset: 0; z-index: 10; background: rgba(10, 16, 22, .88); display: flex; align-items: center;
  justify-content: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }
.lupe figure { margin: 0; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lupe img { background: #fff; border-radius: 12px; padding: 12px; max-width: 100%; max-height: calc(100dvh - 120px);
  object-fit: contain; touch-action: pinch-zoom; }
.lupe figcaption { color: #e6edf2; font-size: 15px; text-align: center; max-width: 760px; }
.lupe .zu { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; width: 48px; height: 48px;
  border-radius: 24px; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 26px; cursor: pointer; }
/* Fingerbedienung überall: große Tippflächen */
.btn { min-height: 44px; padding: 10px 18px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
select { min-height: 44px; font-size: 16px; }
.link { min-height: 44px; padding: 0 6px; font-size: 15px; }
@media (max-width: 860px) {
  .inhalt.mit-bild { grid-template-columns: 1fr; }
  figure.abb img { max-height: 38vh; }
}
@media (max-width: 560px) {
  .wrap { padding-top: 24px; }
  .script { flex-direction: column; align-items: stretch; }
  .actions .btn { flex: 1; text-align: center; }
  body.lernen .wrap { padding-left: 12px; padding-right: 12px; }
  .side { padding: 18px 18px 16px; }
  .side .a { font-size: 17px; }
  .grade { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grade button { min-height: 62px; font-size: 17px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meine Lernskripte</h1>
    <p id="summary"></p>
  </header>
  <nav class="tabs">
    <a href="#" id="tab-skripte">Lernskripte</a>
    <a href="#karteikarten" id="tab-karten">Karteikarten</a>
  </nav>

  <section id="view-skripte">
    <input class="search" id="q" type="search" placeholder="Modul suchen …" autocomplete="off">
    <main id="list"></main>
    <footer>PDFs werden automatisch aus den Typst-Dateien erzeugt.</footer>
  </section>

  <section id="view-karten" hidden></section>
</div>
<script>
const DATA = /*DATA*/null;
const DECKS = /*KARTEN*/null || [];
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.round(b / 1e3) + " KB";
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

document.getElementById("summary").textContent =
  `${DATA.length} Module · Lernskripte als PDF und Karteikarten zum Üben`;

function render(query) {
  const q = query.trim().toLowerCase();
  const html = DATA.filter(m => !q || m.name.toLowerCase().includes(q) || m.title.toLowerCase().includes(q))
    .map(m => `<div class="script"><div><div class="title">${esc(m.name)}</div>
      <div class="sub">Lernskript · <span class="stand">Stand ${fmtDate(m.updated)}</span></div>
      <div class="meta">${m.pages} Seiten · ${fmtSize(m.size)}</div></div>
      <div class="actions"><a class="btn" href="${m.file}" target="_blank" rel="noopener">Ansehen</a>
      <a class="btn primary" href="${m.file}" download="${esc(m.download)}">Download</a></div></div>`).join("");
  document.getElementById("list").innerHTML = html || `<p class="empty">Nichts gefunden.</p>`;
}
// Download über einen Blob, damit jeder Browser (auch Safari auf iPad/iPhone) den Dateinamen übernimmt.
document.getElementById("list").addEventListener("click", async e => {
  const a = e.target.closest("a[download]");
  if (!a) return;
  e.preventDefault();
  const text = a.textContent;
  a.textContent = "Lädt …";
  try {
    const blob = await (await fetch(a.href)).blob();
    const url = URL.createObjectURL(blob);
    const tmp = Object.assign(document.createElement("a"), { href: url, download: a.getAttribute("download") });
    document.body.appendChild(tmp); tmp.click(); tmp.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch { location.href = a.href; }
  a.textContent = text;
});
const input = document.getElementById("q");
input.addEventListener("input", () => render(input.value));
render("");

/* ───────────── Karteikarten ─────────────
   Wiederholung nach dem Anki-Prinzip (SM-2): Neue Karten durchlaufen zwei Lernschritte in der Runde,
   danach wächst der Abstand mit dem Leichtigkeitsfaktor der Karte (Start 2,5). „Nochmal“ holt die
   Karte in derselben Runde zurück und senkt den Faktor, „Leicht“ hebt ihn. Jede Runde wird neu gemischt.
   Der Fortschritt liegt im Browser (localStorage), getrennt je Modul und Gerät. */
const TAG = 864e5;
const LERNSCHRITTE = 2;                          // so oft „Gut“, bis eine neue Karte in die Wiederholung kommt
const ABSTAND = { 1: 3, 2: 5, 3: 9 };             // nach so vielen Karten kommt eine Lernkarte in der Runde wieder
const view = document.getElementById("view-karten");
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const stateKey = name => "karteikarten:" + name;
const einstellungen = store.get("karteikarten:einstellungen", { neu: 20 });
let sitzung = null;

// Ein Lerntag beginnt wie bei Anki um 4 Uhr, damit späte Abende noch zum Vortag zählen.
function tagEnde(t = Date.now()) {
  const d = new Date(t - 4 * 36e5);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + TAG + 4 * 36e5;
}
const fällig = (s, jetzt = Date.now()) => s && s.due < tagEnde(jetzt);   // alles, was heute dran ist
function mischen(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function zählen(deck, kapitel) {
  const st = store.get(stateKey(deck.name), {});
  const karten = deck.cards.filter(c => !kapitel || c.k === kapitel);
  const r = { due: 0, neu: 0, ok: 0, lern: 0, gesamt: karten.length, nächste: Infinity };
  for (const c of karten) {
    const s = st[c.id];
    if (!s) r.neu++;
    else if (fällig(s)) r.due++;
    else { s.typ === "wdh" && s.ivl >= 21 ? r.ok++ : r.lern++; r.nächste = Math.min(r.nächste, s.due); }
  }
  return r;
}

// Was passiert bei Bewertung n (1 Nochmal, 2 Schwer, 3 Gut, 4 Leicht)? Gibt den neuen Zustand zurück.
function planen(s, n, jetzt = Date.now()) {
  s = s ? { ...s } : { typ: "neu", schritt: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
  const streuen = t => t <= 2 ? t : Math.round(t * (0.95 + Math.random() * 0.1));
  const wiederholung = ivl => Object.assign(s, { typ: "wdh", schritt: 0, ivl, due: tagEnde(jetzt) - TAG + ivl * TAG });
  s.reps++;
  if (s.typ === "wdh") {
    if (n === 1) {
      s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
      Object.assign(s, { typ: "neu-lernen", schritt: 0, ivl: Math.max(1, Math.round(s.ivl * 0.3)), due: jetzt });
    } else if (n === 2) { s.ease = Math.max(1.3, s.ease - 0.15); wiederholung(streuen(Math.max(s.ivl + 1, Math.round(s.ivl * 1.2)))); }
    else if (n === 3) wiederholung(streuen(Math.max(s.ivl + 1, Math.round(s.ivl * s.ease))));
    else { s.ease += 0.15; wiederholung(streuen(Math.max(s.ivl + 2, Math.round(s.ivl * s.ease * 1.3)))); }
    return s;
  }
  // Neue Karte oder Karte im (Neu-)Lernen
  const neuLernen = s.typ === "neu-lernen";
  if (s.typ === "neu") s.typ = "lernen";
  if (n === 1) { s.schritt = 0; s.due = jetzt; }
  else if (n === 2) s.due = jetzt;
  else if (n === 3 && s.schritt + 1 < (neuLernen ? 1 : LERNSCHRITTE)) { s.schritt++; s.due = jetzt; }
  else if (n === 3) wiederholung(neuLernen ? s.ivl : 1);
  else { if (!neuLernen) s.ease += 0.15; wiederholung(neuLernen ? s.ivl + 1 : 4); }
  return s;
}
function dauer(s, jetzt = Date.now()) {
  if (s.typ !== "wdh") return "heute nochmal";
  const t = Math.round((s.due - (tagEnde(jetzt) - TAG)) / TAG);
  if (t <= 1) return "morgen";
  if (t < 30) return `${t} T`;
  if (t < 365) return `${(t / 30).toFixed(t < 300 ? 1 : 0).replace(".", ",")} Mon`;
  return `${(t / 365).toFixed(1).replace(".", ",")} J`;
}

function deckÜbersicht() {
  sitzung = null;
  if (!DECKS.length) { view.innerHTML = `<p class="empty">Noch keine Karteikarten vorhanden.</p>`; return; }
  view.innerHTML = `<p class="intro">Verständnisfragen je Modul. Fällige Karten kommen zuerst, schwierige öfter, sichere immer seltener.</p>` +
    DECKS.map(d => {
      const z = zählen(d);
      return `<div class="script"><div><div class="title">${esc(d.name)}</div>
        <div class="counts"><span class="c-due"><b>${z.due}</b> fällig</span><span class="c-new"><b>${z.neu}</b> neu</span>
        <span class="c-ok"><b>${z.ok}</b> sicher</span><span class="muted">${z.gesamt} Karten</span></div></div>
        <div class="actions"><a class="btn primary" href="#karteikarten/${encodeURIComponent(d.name)}">Lernen</a></div></div>`;
    }).join("") +
    `<footer>Dein Fortschritt wird nur in diesem Browser gespeichert (je Gerät getrennt).</footer>`;
}

function deckSeite(deck) {
  sitzung = null;
  const kapitel = [...new Set(deck.cards.map(c => c.k).filter(Boolean))];
  const gewählt = store.get("karteikarten:kapitel:" + deck.name, "");
  const k = kapitel.includes(gewählt) ? gewählt : "";
  const z = zählen(deck, k);
  const nächste = z.nächste < Infinity ? new Date(z.nächste).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) : "";
  view.innerHTML = `<a class="back" href="#karteikarten">← Alle Module</a>
    <div class="deckhead"><h2>${esc(deck.name)}</h2>
      <div class="counts"><span class="c-due"><b>${z.due}</b> fällig</span><span class="c-new"><b>${z.neu}</b> neu</span>
      <span class="muted"><b>${z.lern}</b> in Arbeit</span><span class="c-ok"><b>${z.ok}</b> sicher</span></div></div>
    <div class="panel">
      <div class="row"><label class="l" for="kap">Kapitel</label>
        <select id="kap"><option value="">Alle Kapitel (${deck.cards.length})</option>${kapitel.map(x =>
          `<option${x === k ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="row"><label class="l" for="neu">Neue Karten pro Runde</label>
        <select id="neu">${[5, 10, 20, 30, 1000].map(n => `<option value="${n}"${n === einstellungen.neu ? " selected" : ""}>${n === 1000 ? "alle" : n}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="start"${z.due + z.neu ? "" : " disabled"}>Lernen starten (${z.due + Math.min(z.neu, einstellungen.neu)} Karten)</button>
        <button class="btn" id="frei">Frei üben (alle ${z.gesamt} gemischt)</button></div>
      ${z.due + z.neu ? "" : `<p class="muted" style="margin:12px 0 0">Für heute ist alles erledigt.${nächste ? ` Nächste Wiederholung: ${nächste}.` : ""} Mit „Frei üben“ kannst du trotzdem alles durchgehen, ohne den Plan zu ändern.</p>`}
    </div>
    <p class="feynman"><b>Feynman-Prinzip:</b> Erklär die Antwort laut und in eigenen, einfachen Worten, als würdest du sie jemandem ohne Vorwissen erklären. Erst dann umdrehen und ehrlich bewerten: Wo deine Erklärung gehakt hat, liegt die Lücke.</p>
    <div class="row" style="margin-top:28px"><button class="link" id="export">Fortschritt sichern</button>
      <button class="link" id="import">Fortschritt laden</button><button class="link" id="reset">Fortschritt zurücksetzen</button></div>`;
  view.querySelector("#kap").onchange = e => { store.set("karteikarten:kapitel:" + deck.name, e.target.value); deckSeite(deck); };
  view.querySelector("#neu").onchange = e => { einstellungen.neu = +e.target.value; store.set("karteikarten:einstellungen", einstellungen); deckSeite(deck); };
  view.querySelector("#start").onclick = () => starten(deck, k, false);
  view.querySelector("#frei").onclick = () => starten(deck, k, true);
  view.querySelector("#reset").onclick = () => {
    if (confirm(`Lernfortschritt für ${deck.name} wirklich löschen?`)) { store.set(stateKey(deck.name), {}); deckSeite(deck); }
  };
  view.querySelector("#export").onclick = () => {
    const blob = new Blob([JSON.stringify({ modul: deck.name, stand: new Date().toISOString(), karten: store.get(stateKey(deck.name), {}) })], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `Karteikarten ${deck.name} Fortschritt.json` });
    document.body.appendChild(a); a.click(); a.remove();
  };
  view.querySelector("#import").onclick = () => {
    const f = Object.assign(document.createElement("input"), { type: "file", accept: ".json,application/json" });
    f.onchange = async () => {
      try {
        const d = JSON.parse(await f.files[0].text());
        if (d.modul !== deck.name || typeof d.karten !== "object") throw 0;
        store.set(stateKey(deck.name), d.karten); deckSeite(deck);
      } catch { alert("Diese Datei passt nicht zu " + deck.name + "."); }
    };
    f.click();
  };
}

function starten(deck, kapitel, frei) {
  const st = store.get(stateKey(deck.name), {});
  const karten = deck.cards.filter(c => !kapitel || c.k === kapitel);
  let queue;
  if (frei) queue = mischen([...karten]);
  else {
    const due = karten.filter(c => fällig(st[c.id]));
    const neu = karten.filter(c => !st[c.id]).slice(0, einstellungen.neu);
    queue = mischen([...due, ...neu]);
  }
  if (!queue.length) return;
  sitzung = { deck, kapitel, frei, queue, gesehen: new Set(), fertig: 0, start: queue.length, stats: { 1: 0, 2: 0, 3: 0, 4: 0 }, umgedreht: false };
  zeigen();
}

function zeigen() {
  const s = sitzung;
  if (!s.queue.length) return ende();
  const c = s.queue[0];
  const st = s.frei ? null : store.get(stateKey(s.deck.name), {})[c.id];
  s.umgedreht = false;
  const vorschau = s.frei ? ["heute nochmal", "", "", ""] : [1, 2, 3, 4].map(n => dauer(planen(st, n)));
  const offen = s.queue.length;
  document.body.classList.add("lernen");
  const bilder = (c.i || []).map((b, n) => `<figure class="abb"><button type="button" data-bild="${n}" aria-label="Abbildung groß ansehen">
      <img src="${b.src}" alt="${esc(b.cap.replace(/<[^>]+>/g, ""))}" loading="lazy"></button>${b.cap ? `<figcaption>${b.cap}</figcaption>` : ""}</figure>`).join("");
  const quelle = c.s ? `<a class="quelle" href="${s.deck.pdf}#page=${c.s.p}" target="_blank" rel="noopener">📖 Lernskript S. ${c.s.p}
      <span>${esc(c.s.t)}</span></a>` : "";
  view.innerHTML = `<div class="topbar"><a class="back" href="#karteikarten/${encodeURIComponent(s.deck.name)}">← ${esc(s.deck.name)}</a>
      <div class="bar"><i style="width:${Math.round(100 * s.fertig / (s.fertig + offen))}%"></i></div>
      <span class="zahl">${s.fertig} / ${s.fertig + offen}</span></div>
    <div class="status"><span>${esc(c.k)}</span>
      <span>${s.frei ? `<span class="mode">Frei üben – ändert den Plan nicht</span>` : !st ? "neue Karte" : st.typ === "wdh" ? "Wiederholung" : "im Lernen"}</span></div>
    <div class="stage"><div class="flash" id="flash">
      <div class="side"><div class="q">${c.q}</div>
        <div class="hint">Erst laut in eigenen Worten erklären, dann antippen zum Umdrehen</div></div>
      <div class="side back-side"><div class="q-small">${c.q}</div>
        <div class="inhalt${bilder ? " mit-bild" : ""}"><div class="a">${c.a}</div>${bilder ? `<div>${bilder}</div>` : ""}</div>
        ${c.b || quelle ? `<div class="fuss">${c.b ? `<div class="merkbild"><b>Merkbild</b>${c.b}</div>` : ""}${quelle}</div>` : ""}</div>
    </div></div>
    <div id="controls"><button class="btn primary flipbtn" id="flip">Antwort zeigen</button></div>`;
  view.querySelectorAll("[data-bild]").forEach(b => b.onclick = e => { e.stopPropagation(); lupe(c.i[+b.dataset.bild]); });
  const flash = view.querySelector("#flash");
  const umdrehen = () => {
    if (s.umgedreht) return;
    s.umgedreht = true;
    flash.classList.add("flipped");
    const namen = s.frei ? ["Nochmal", "Gewusst"] : ["Nochmal", "Schwer", "Gut", "Leicht"];
    view.querySelector("#controls").innerHTML = `<p class="hint" style="margin:0 0 8px">Wie gut konntest du es erklären?</p>
      <div class="grade"${s.frei ? ' style="grid-template-columns:1fr 1fr"' : ""}>${namen.map((n, i) => {
        const note = s.frei ? (i ? 3 : 1) : i + 1;
        return `<button class="g${note}" data-n="${note}">${n}<small>${s.frei ? (i ? "raus aus der Runde" : "kommt gleich wieder") : vorschau[i]}</small></button>`;
      }).join("")}</div>`;
    view.querySelectorAll(".grade button").forEach(b => b.onclick = () => bewerten(+b.dataset.n));
  };
  flash.onclick = e => { if (!e.target.closest("a, button")) umdrehen(); };
  view.querySelector("#flip").onclick = umdrehen;
  // Wischen auf der umgedrehten Karte: links = Nochmal, rechts = Gut
  let x0 = null;
  flash.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  flash.addEventListener("touchend", e => {
    if (x0 === null || !s.umgedreht) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 70) bewerten(dx < 0 ? 1 : 3);
  });
}

function lupe(b) {
  const d = document.createElement("div");
  d.className = "lupe";
  d.innerHTML = `<button class="zu" aria-label="Schließen">×</button><figure><img src="${b.src}" alt="">
    ${b.cap ? `<figcaption>${b.cap}</figcaption>` : ""}</figure>`;
  d.onclick = e => { if (e.target === d || e.target.closest(".zu") || e.target.tagName === "FIGCAPTION") d.remove(); };
  document.body.appendChild(d);
}

function bewerten(n) {
  const s = sitzung;
  if (!s || !s.umgedreht) return;
  const c = s.queue.shift();
  s.stats[n]++;
  let nochmal;
  if (s.frei) nochmal = n === 1;
  else {
    const alle = store.get(stateKey(s.deck.name), {});
    const neu = planen(alle[c.id], n);
    alle[c.id] = neu;
    store.set(stateKey(s.deck.name), alle);
    nochmal = neu.typ !== "wdh";
  }
  if (nochmal) {
    // In der Runde nach ein paar anderen Karten wiederholen, mit etwas Zufall in der Position.
    const pos = Math.min(s.queue.length, ABSTAND[Math.min(n, 3)] + Math.floor(Math.random() * 3));
    s.queue.splice(pos, 0, c);
  } else s.fertig++;
  zeigen();
}

function ende() {
  const s = sitzung;
  document.body.classList.remove("lernen");
  const z = zählen(s.deck, s.kapitel);
  const nochNeu = !s.frei && z.neu > 0;
  view.innerHTML = `<a class="back" href="#karteikarten/${encodeURIComponent(s.deck.name)}">← ${esc(s.deck.name)}</a>
    <div class="panel done"><h2>Runde geschafft 🎉</h2>
      <p class="muted">${s.fertig} Karten erledigt · ${s.stats[1]}× Nochmal${s.frei ? "" : ` · ${s.stats[2]}× Schwer · ${s.stats[3]}× Gut · ${s.stats[4]}× Leicht`}</p>
      <p>Die Karten, bei denen deine Erklärung gehakt hat, kommen bald wieder. Die sicheren erst in einigen Tagen.</p>
      <div class="row">${nochNeu ? `<button class="btn primary" id="mehr">Weitere neue Karten</button>` : ""}
        <button class="btn" id="frei">Frei üben (neu gemischt)</button>
        <a class="btn" href="#karteikarten">Alle Module</a></div></div>`;
  if (nochNeu) view.querySelector("#mehr").onclick = () => starten(s.deck, s.kapitel, false);
  view.querySelector("#frei").onclick = () => starten(s.deck, s.kapitel, true);
}

document.addEventListener("keydown", e => {
  if (!sitzung || !sitzung.queue.length || e.target.closest("input, select, textarea")) return;
  if ((e.key === " " || e.key === "Enter") && !sitzung.umgedreht) { e.preventDefault(); view.querySelector("#flash")?.click(); }
  else if (/^[1-4]$/.test(e.key) && sitzung.umgedreht) {
    const n = sitzung.frei ? (e.key === "1" ? 1 : 3) : +e.key;
    bewerten(n);
  }
});

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  document.body.classList.remove("lernen");
  document.querySelector(".lupe")?.remove();
  const karten = h.startsWith("karteikarten");
  document.getElementById("view-skripte").hidden = karten;
  view.hidden = !karten;
  document.getElementById("tab-skripte").toggleAttribute("aria-current", !karten);
  document.getElementById("tab-karten").toggleAttribute("aria-current", karten);
  document.querySelectorAll(".tabs a[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  if (!karten) return;
  const deck = DECKS.find(d => d.name === h.slice("karteikarten/".length));
  deck ? deckSeite(deck) : deckÜbersicht();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
// Zurück-Links zeigen oft auf die gleiche Adresse wie die laufende Runde: dann selbst neu aufbauen.
view.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (a && a.hash === location.hash) { e.preventDefault(); route(); }
});
route();
</script>
</body>
</html>
